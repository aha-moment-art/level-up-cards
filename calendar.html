glish/english/features/6-minute-english_2026/ep-260716","audio":"calendar-audio/2026-09-21-2.mp3"}],"reading":{"title":"How to spot fake news","url":"https://learnenglish.britishcouncil.org/free-resources/reading/b1/how-spot-fake-news"}},{"date":"2026-09-22","label":"22","weekday":"周二","title":"LOOK BACK. keep going.","page":"https://jeweled-rumba-883.notion.site/3dc7234fb5e580ba8113f58fd2c19348","first":201,"last":250,"episodes":[{"title":"Rude emails","source":"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026/ep-260702","audio":"calendar-audio/2026-09-22-1.mp3"},{"title":"Should we cycle more?","source":"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026/ep-260709","audio":"calendar-audio/2026-09-22-2.mp3"}],"reading":{"title":"Robot teachers","url":"https://learnenglish.britishcouncil.org/free-resources/reading/b1/robot-teachers"}}],"words":[{"id":1,"word":"cancel","meaning":"取消， 废除； 抵消， 对消； 删去， 划掉","ukphone":"'kænsl","usphone":"'kænsl","collocation":"cancel a booking","example":"We had to cancel our booking because the train stopped running.","translation":"火车停运了，我们只好取消预订。","note":""},{"id":2,"word":"explosive","meaning":"爆炸的， 爆发的； 使人冲动的；爆炸物，炸药","ukphone":"ɪk'spləusɪv","usphone":"ɪk'splosɪv; ɪk'splozɪv","collocation":"explosive growth","example":"The town experienced explosive growth after the new railway opened.","translation":"新铁路开通后，这个城镇迅速发展。","note":""},{"id":3,"word":"prepare","meaning":"准备， 预备","ukphone":"prɪ'peə(r)","usphone":"prɪ'pɛr","collocation":"prepare for an exam","example":"Maya stayed home to prepare for her final exam.","translation":"玛雅留在家里准备期末考试。","note":""},{"id":4,"word":"crusade","meaning":"加入十字军， 投身正义运动；十字军；斗争，运动","ukphone":"kruː'seɪd","usphone":"kru'sed","collocation":"a crusade against waste","example":"The students began a crusade against food waste on campus.","translation":"学生们在校园发起了反对食物浪费的运动。","note":""},{"id":5,"word":"hamlet","meaning":"小村庄","ukphone":"'hæmlət","usphone":"'hæmlət","collocation":"a remote hamlet","example":"A narrow footpath connects the remote hamlet to the main road.","translation":"一条狭窄的小路把这个偏远村庄与大路连接起来。","note":""},{"id":6,"word":"surgeon","meaning":"外科医生","ukphone":"'sɜːdʒən","usphone":"'sɝdʒən","collocation":"a skilled surgeon","example":"The surgeon explained the procedure carefully before answering our questions.","translation":"外科医生仔细解释了手术流程，然后回答我们的问题。","note":""},{"id":7,"word":"hall","meaning":"门厅； 礼堂","ukphone":"hɔːl","usphone":"hɔl","collocation":"the entrance hall","example":"Please leave your wet umbrella in the entrance hall.","translation":"请把湿雨伞放在门厅。","note":""},{"id":8,"word":"discourage","meaning":"使泄气， 使灰心； 阻止， 劝阻","ukphone":"dɪs'kʌrɪdʒ","usphone":"dɪs'kɝɪdʒ","collocation":"discourage someone from doing","example":"One disappointing result should not discourage you from trying again.","translation":"一次令人失望的结果不该让你放弃再次尝试。","note":""},{"id":9,"word":"predispose","meaning":"事先影响某人； 偏爱； 易受感染","ukphone":"ˌpriːdɪ'spəuz","usphone":"'pridɪ'spoz","collocation":"predispose someone to","example":"Early success may predispose students to expect equally easy progress later.","translation":"早期的成功可能使学生倾向于期待以后也能轻松进步。","note":"常用义为“使倾向于；使易受某事影响”，不是主动“偏爱”。"},{"id":10,"word":"oversee","meaning":"监督， 监视； 俯瞰， 眺望","ukphone":"ˌəuvə'siː","usphone":"'ovɚ'si","collocation":"oversee a project","example":"An experienced engineer will oversee the bridge repair project.","translation":"一位经验丰富的工程师将监督桥梁维修项目。","note":"现代常用义是“监督、管理”；不宜将“俯瞰、眺望”作为常用义。"},{"id":11,"word":"pollution","meaning":"污染， 污染物； 玷污","ukphone":"pə'luːʃn","usphone":"pə'luʃən","collocation":"air pollution","example":"The city introduced cleaner buses to reduce air pollution.","translation":"这座城市引进了更清洁的公交车，以减少空气污染。","note":""},{"id":12,"word":"pretend","meaning":"装作， 假装","ukphone":"prɪ'tend","usphone":"prɪ'tɛnd","collocation":"pretend to be asleep","example":"I tried to pretend to be asleep when the children entered.","translation":"孩子们进来时，我试图装睡。","note":""},{"id":13,"word":"convection","meaning":"传送； 对流","ukphone":"kən'vekʃn","usphone":"kən'vɛkʃən","collocation":"convection currents","example":"The teacher used coloured water to demonstrate convection currents.","translation":"老师用有色水演示对流。","note":"核心义是“对流”，不是一般的“传送”。"},{"id":14,"word":"warrant","meaning":"保证；","ukphone":"'wɒrənt","usphone":"'wɔrənt","collocation":"warrant further investigation","example":"These unexpected results warrant further investigation before we publish.","translation":"这些意外结果值得进一步调查后再发表。","note":"补充动词“使有必要；使正当”，名词“搜查令、逮捕令；依据”。"},{"id":15,"word":"ecliptic","meaning":"【天】","ukphone":"ɪ'klɪptɪk","usphone":"ɪ'klɪptɪk","collocation":"the ecliptic plane","example":"The diagram shows Earth's orbit within the ecliptic plane.","translation":"这张图展示了地球在黄道平面内的轨道。","note":"补全：黄道；黄道的。"},{"id":16,"word":"conceal","meaning":"隐藏； 隐瞒； 掩盖","ukphone":"kən'siːl","usphone":"kən'sil","collocation":"conceal the truth","example":"The damaged label could not conceal the bottle's age.","translation":"破损的标签无法掩盖这个瓶子的年代。","note":""},{"id":17,"word":"overrate","meaning":"对…评价过高， 高估","ukphone":"ˌəuvə'reɪt","usphone":",ovɚ'ret","collocation":"overrate one's ability","example":"Beginners sometimes overrate their ability and choose routes that are too difficult.","translation":"初学者有时高估自己的能力，选择过于困难的路线。","note":""},{"id":18,"word":"meanwhile","meaning":"与此同时","ukphone":"'miːnwaɪl","usphone":"'minwaɪl","collocation":"meanwhile at home","example":"I watered the garden; meanwhile, my brother prepared lunch.","translation":"我给花园浇水；与此同时，弟弟准备午餐。","note":""},{"id":19,"word":"opulent","meaning":"豪华的， 华丽的， 富裕的； 丰富的， 丰饶的","ukphone":"'ɒpjələnt","usphone":"'ɑpjələnt","collocation":"an opulent interior","example":"The hotel's opulent interior contrasted with its plain stone exterior.","translation":"酒店豪华的内部与朴素的石质外观形成对比。","note":""},{"id":20,"word":"coincide","meaning":"同时发生； 一致","ukphone":"ˌkəuɪn'saɪd","usphone":",koɪn'saɪd","collocation":"coincide with","example":"My visit will coincide with the opening of the exhibition.","translation":"我到访的时间将恰逢展览开幕。","note":""},{"id":21,"word":"competent","meaning":"有能力的； 能胜任的","ukphone":"'kɒmpɪtnt","usphone":"'kɑmpɪtənt","collocation":"a competent manager","example":"We need a competent manager who can organise the new team.","translation":"我们需要一位能组织新团队的称职经理。","note":""},{"id":22,"word":"require","meaning":"需要； 命令； 规定， 要求","ukphone":"rɪ'kwaɪə(r)","usphone":"rɪ'kwaɪr","collocation":"require approval","example":"Changes to the timetable require approval from the course director.","translation":"课表调整需要课程主任批准。","note":""},{"id":23,"word":"scratch","meaning":"划伤，","ukphone":"skrætʃ","usphone":"skrætʃ","collocation":"scratch the surface","example":"Be careful not to scratch the surface of the wooden table.","translation":"小心别划伤木桌的表面。","note":""},{"id":24,"word":"compassionate","meaning":"有同情心的， 表示怜悯的","ukphone":"kəm'pæʃənət","usphone":"kəm'pæʃənət","collocation":"compassionate care","example":"The volunteers offered compassionate support to families after the flood.","translation":"洪水过后，志愿者为各家提供了充满关怀的支持。","note":""},{"id":25,"word":"cooperative","meaning":"合作的，协作的；合作社","ukphone":"kəu'ɒpərətɪv","usphone":"ko'ɑpərətɪv","collocation":"a cooperative approach","example":"A cooperative approach helped both teams finish the project early.","translation":"合作的方式帮助两个团队提前完成了项目。","note":""},{"id":26,"word":"strategist","meaning":"战略家","ukphone":"'strætədʒɪst","usphone":"'strætədʒɪst","collocation":"a skilled strategist","example":"The team's strategist adjusted the plan after studying the opposition.","translation":"团队的策略师研究对手后调整了计划。","note":""},{"id":27,"word":"irritable","meaning":"急躁的， 易怒的， 易受刺激的； 过敏的","ukphone":"'ɪrɪtəbl","usphone":"'ɪrɪtəbl","collocation":"feel irritable","example":"After a sleepless night, I felt irritable during the morning meeting.","translation":"一夜未眠后，我在早会上感到烦躁。","note":""},{"id":28,"word":"triple","meaning":"三部分的；三倍的；增至三倍","ukphone":"'trɪpl","usphone":"'trɪpl","collocation":"triple the amount","example":"We need to triple the amount of rice for tonight's guests.","translation":"为了今晚的客人，我们需要把米量增加到三倍。","note":""},{"id":29,"word":"reserved","meaning":"说话不多的， 内向的； 有所保留的， 预订的","ukphone":"rɪ'zɜːvd","usphone":"rɪ'zɝvd","collocation":"a reserved manner","example":"Although usually reserved, she spoke confidently about her research.","translation":"她通常话不多，但谈起自己的研究却很自信。","note":""},{"id":30,"word":"temper","meaning":"情绪；使缓和","ukphone":"'tempə(r)","usphone":"'tɛmpɚ","collocation":"lose one's temper","example":"He lost his temper when the printer jammed again.","translation":"打印机再次卡纸时，他发火了。","note":""},{"id":31,"word":"tickle","meaning":"发痒；使高兴，逗乐；痒","ukphone":"'tɪkl","usphone":"'tɪkl","collocation":"tickle someone's feet","example":"The children laughed as tiny waves began to tickle their feet.","translation":"小浪花开始挠孩子们的脚，他们笑了起来。","note":""},{"id":32,"word":"object","meaning":"反对， 不赞成；物体；对象；目标；宾语[əb'dʒekt]","ukphone":"'ɒbdʒɪkt","usphone":"'ɑbdʒɛkt","collocation":"object to a proposal","example":"Several residents object to the proposal because it removes public gardens.","translation":"几位居民反对该提议，因为它会取消公共花园。","note":""},{"id":33,"word":"accessible","meaning":"能接近的； 易达到的","ukphone":"ək'sesəbl","usphone":"ək'sɛsəbl","collocation":"easily accessible","example":"The museum is easily accessible by bus from the station.","translation":"从车站乘公交可以方便地到达博物馆。","note":""},{"id":34,"word":"hang","meaning":"悬挂， 吊， 垂下； 吊死， 绞死","ukphone":"hæŋ","usphone":"hæŋ","collocation":"hang a picture","example":"We will hang the picture above the living room sofa.","translation":"我们会把这幅画挂在客厅沙发上方。","note":""},{"id":35,"word":"authenticate","meaning":"鉴别， 证明","ukphone":"ɔː'θentɪkeɪt","usphone":"ɔ'θɛntɪket","collocation":"authenticate a painting","example":"Experts examined the pigments to authenticate the recently discovered painting.","translation":"专家检查颜料，以鉴定这幅新近发现画作的真伪。","note":""},{"id":36,"word":"suffice","meaning":"满足， 满意； 足够","ukphone":"sə'faɪs","usphone":"sə'faɪs","collocation":"suffice for","example":"Two small tables should suffice for our exhibition materials.","translation":"两张小桌子应该足够放我们的展览材料。","note":"常用义是“足够；满足需要”，不表示感到“满意”。"},{"id":37,"word":"concede","meaning":"承认； 让步","ukphone":"kən'siːd","usphone":"kən'sid","collocation":"concede a point","example":"She had to concede that the cheaper design was more practical.","translation":"她不得不承认，更便宜的设计更实用。","note":""},{"id":38,"word":"notable","meaning":"值得注意的；显著的，杰出的，显赫的；名人， 要人","ukphone":"'nəutəbl","usphone":"'notəbl","collocation":"a notable improvement","example":"There has been a notable improvement in the river's water quality.","translation":"河流水质有了显著改善。","note":""},{"id":39,"word":"unparalleled","meaning":"无双的， 无比的， 空前的","ukphone":"ʌn'pærəleld","usphone":"ʌn'pærəlɛld","collocation":"unparalleled access","example":"The archive offers researchers unparalleled access to the writer's private letters.","translation":"该档案馆为研究者提供了无与伦比的作家私人信件查阅条件。","note":""},{"id":40,"word":"plush","meaning":"豪华的，舒适的；长毛绒","ukphone":"plʌʃ","usphone":"plʌʃ","collocation":"a plush sofa","example":"We sank into a plush sofa beside the hotel fireplace.","translation":"我们坐进酒店壁炉旁柔软舒适的沙发里。","note":""},{"id":41,"word":"evaporate","meaning":"蒸发； 消失； 不复存在","ukphone":"ɪ'væpəreɪt","usphone":"ɪ'væpəret","collocation":"evaporate quickly","example":"Water will evaporate more quickly from a shallow open dish.","translation":"水从敞口浅盘中蒸发得更快。","note":""},{"id":42,"word":"commission","meaning":"委托；佣金；授权， 委托","ukphone":"kə'mɪʃn","usphone":"kə'mɪʃən","collocation":"commission a portrait","example":"The library plans to commission a portrait of its founder.","translation":"图书馆计划委托画家为创始人绘制肖像。","note":""},{"id":43,"word":"staircase","meaning":"楼梯","ukphone":"'steəkeɪs","usphone":"'stɛrkes","collocation":"a spiral staircase","example":"A narrow staircase leads to the apartment above the bakery.","translation":"一段狭窄的楼梯通向面包店楼上的公寓。","note":""},{"id":44,"word":"flip","meaning":"轻抛； 轻弹","ukphone":"flɪp","usphone":"flɪp","collocation":"flip a coin","example":"We decided to flip a coin to choose the first player.","translation":"我们决定抛硬币来选出第一个玩家。","note":""},{"id":45,"word":"connect","meaning":"连接， 衔接； 联合， 关联； 由…联想到； 给…接通电话","ukphone":"kə'nekt","usphone":"kə'nɛkt","collocation":"connect to a network","example":"You can connect your laptop to the library's wireless network.","translation":"你可以把笔记本电脑连接到图书馆的无线网络。","note":""},{"id":46,"word":"resume","meaning":"重新开始， 继续恢复","ukphone":"rɪ'zjuːm","usphone":"","collocation":"resume work","example":"The builders will resume work once the heavy rain stops.","translation":"大雨一停，建筑工人就会复工。","note":""},{"id":47,"word":"address","meaning":"致函，写姓名地址；向…讲话，演说；处理，","ukphone":"ə'dres","usphone":"əˈdrɛs;(for n)ˈædres; ædrɛs","collocation":"address a problem","example":"The new timetable should address the problem of overcrowded classrooms.","translation":"新课表应该能解决教室过于拥挤的问题。","note":""},{"id":48,"word":"posture","meaning":"姿势； 心情； 态度","ukphone":"'pɒstʃə(r)","usphone":"'pɑstʃɚ","collocation":"an upright posture","example":"The drawing class began with a study of the model's posture.","translation":"绘画课开始时，大家先研究模特的姿势。","note":""},{"id":49,"word":"spiral","meaning":"螺旋形的，盘旋的；盘旋上升；急剧增长；螺旋形；逐渐加速上升","ukphone":"'spaɪərəl","usphone":"'spaɪrəl","collocation":"spiral upwards","example":"Housing costs continued to spiral despite the slowdown in demand.","translation":"尽管需求放缓，住房成本仍持续急剧上涨。","note":""},{"id":50,"word":"decapitate","meaning":"斩首","ukphone":"dɪ'kæpɪteɪt","usphone":"dɪ'kæpɪtet","collocation":"decapitate a statue","example":"The museum records explain how vandals attempted to decapitate the statue.","translation":"博物馆的记录解释了破坏者如何企图砍掉雕像的头。","note":""},{"id":51,"word":"halt","meaning":"暂停；踌躇；","ukphone":"hɔːlt","usphone":"hɔlt","collocation":"bring to a halt","example":"A fallen tree brought traffic to a halt this morning.","translation":"今早，一棵倒下的树让交通陷入停顿。","note":""},{"id":52,"word":"exorbitant","meaning":"过分的， 不合理的","ukphone":"ɪg'zɔːbɪtənt","usphone":"ɪɡ'zɔrbɪtənt","collocation":"exorbitant prices","example":"We left the café after seeing its exorbitant prices.","translation":"看到价格贵得离谱，我们离开了那家咖啡馆。","note":""},{"id":53,"word":"surgery","meaning":"外科学； 外科手术； 手术室， 诊疗室","ukphone":"'sɜːdʒəri","usphone":"'sɝdʒəri","collocation":"recover from surgery","example":"My neighbour is recovering from surgery and appreciates our weekly visits.","translation":"我的邻居正在术后恢复，很感谢我们每周去探望。","note":""},{"id":54,"word":"violent","meaning":"暴力的； 带有强烈感情的； 猛烈的","ukphone":"'vaɪələnt","usphone":"'vaɪələnt","collocation":"a violent storm","example":"A violent storm damaged several fishing boats along the coast.","translation":"一场猛烈的风暴损坏了沿岸的几艘渔船。","note":""},{"id":55,"word":"resolve","meaning":"解决，解答；决定，决意；分解，分析；决心， 决意","ukphone":"rɪ'zɒlv","usphone":"rɪ'zɑlv","collocation":"resolve a dispute","example":"The two neighbours met to resolve their dispute over parking.","translation":"两位邻居见面解决停车方面的争执。","note":""},{"id":56,"word":"confront","meaning":"遭遇； 面对， 正视","ukphone":"kən'frʌnt","usphone":"kən'frʌnt","collocation":"confront a challenge","example":"The village must confront the challenge of an ageing population.","translation":"这个村庄必须面对人口老龄化的挑战。","note":""},{"id":57,"word":"deploy","meaning":"部署； 使用， 运用","ukphone":"dɪ'plɔɪ","usphone":"dɪ'plɔɪ","collocation":"deploy resources","example":"The charity will deploy extra volunteers during the winter food drive.","translation":"冬季食品募捐期间，慈善机构将增派志愿者。","note":""},{"id":58,"word":"reproduce","meaning":"繁殖， 生育； 复制， 仿造， 翻版； 再现， 使…在脑海中重现","ukphone":"ˌriːprə'djuːs","usphone":",riprə'dus","collocation":"reproduce a result","example":"Another laboratory was able to reproduce the original experiment's results.","translation":"另一家实验室成功复现了原实验的结果。","note":""},{"id":59,"word":"huddle","meaning":"聚集在一起；杂乱的一堆； 拥挤","ukphone":"'hʌdl","usphone":"'hʌdl","collocation":"huddle together","example":"The hikers began to huddle together as the temperature dropped.","translation":"气温下降时，徒步者们开始挤在一起取暖。","note":""},{"id":60,"word":"rendition","meaning":"表演， 扮演， 演唱； 翻译； 视觉再现","ukphone":"ren'dɪʃn","usphone":"rɛn'dɪʃən","collocation":"a moving rendition","example":"Her moving rendition of the folk song silenced the crowded room.","translation":"她动人的民歌演唱让拥挤的房间安静下来。","note":""},{"id":61,"word":"intersection","meaning":"道路交叉口， 十字路口","ukphone":"ˌɪntə'sekʃn","usphone":",ɪntɚ'sɛkʃən","collocation":"a busy intersection","example":"Turn left at the busy intersection just beyond the supermarket.","translation":"过了超市后，在那个繁忙的十字路口左转。","note":""},{"id":62,"word":"scholarship","meaning":"奖学金； 学问， 学识","ukphone":"'skɒləʃɪp","usphone":"'skɑlɚʃɪp","collocation":"win a scholarship","example":"Leo won a scholarship that covered most of his tuition fees.","translation":"利奥获得了一笔支付大部分学费的奖学金。","note":""},{"id":63,"word":"besides","meaning":"除此之外，而且","ukphone":"bɪ'saɪdz","usphone":"bɪ'saɪdz","collocation":"besides that","example":"The flat is too expensive; besides, it is far from work.","translation":"这套公寓太贵了，而且离上班的地方很远。","note":""},{"id":64,"word":"instil","meaning":"滴注； 逐渐灌输； 逐步培养","ukphone":"ɪn'stɪl","usphone":"in'stil","collocation":"instil confidence","example":"Regular encouragement can instil confidence in children learning to read.","translation":"经常鼓励可以培养正在学阅读的孩子的信心。","note":""},{"id":65,"word":"inflammable","meaning":"易燃的； 易怒的","ukphone":"ɪn'flæməbl","usphone":"ɪn'flæməbl","collocation":"inflammable materials","example":"The warehouse has a separate storage area for inflammable materials.","translation":"仓库设有易燃材料的独立存放区。","note":""},{"id":66,"word":"implement","meaning":"使生效，实施；贯彻，执行['ImplImənt]；工具","ukphone":"'ɪmplɪment","usphone":"'ɪmplɪmɛnt","collocation":"implement a policy","example":"The university will implement its new recycling policy next term.","translation":"大学将于下学期实施新的回收政策。","note":""},{"id":67,"word":"export","meaning":"出口；输出，传播['3kspɔːt]；出口； 输出； 出口商品","ukphone":"ɪk'spɔːt","usphone":"ˈekspɔːrt；ɪkˈ-","collocation":"export goods","example":"Local farmers export fresh fruit to several neighbouring countries.","translation":"当地农民向几个邻国出口新鲜水果。","note":""},{"id": function restoreSession(ids, saved) {
  const fresh = { signature: ids.join(','), mode: 'learn', queue: [...ids], cursor: 0, ratings: {} };
  if (!saved || saved.signature !== fresh.signature) return fresh;
  const validQueue = Array.isArray(saved.queue) && saved.queue.length > 0 &&
    new Set(saved.queue).size === saved.queue.length && saved.queue.every(id => ids.includes(id));
  const validMode = validQueue && (saved.mode === 'review' || (saved.mode === 'learn' && saved.queue.join(',') === fresh.signature));
  if (!validQueue || !validMode || !Number.isInteger(saved.cursor) || saved.cursor < 0 || saved.cursor > saved.queue.length) return fresh;
  const ratings = {};
  for (const id of ids) if (['known', 'unknown'].includes(saved.ratings?.[id])) ratings[id] = saved.ratings[id];
  return { ...fresh, mode: saved.mode, queue: [...saved.queue], cursor: saved.cursor, ratings };
}

function rateWord(session, rating) {
  if (!['known', 'unknown'].includes(rating) || session.cursor >= session.queue.length) return session;
  const id = session.queue[session.cursor];
  return { ...session, cursor: session.cursor + 1, ratings: { ...session.ratings, [id]: rating } };
}

function reviewWords(session, ids) {
  const queue = ids.filter(id => session.ratings[id] === 'unknown');
  return queue.length ? { ...session, mode: 'review', queue, cursor: 0 } : session;
}

function moveCard(session, direction) {
  if (direction !== -1 && direction !== 1) return session;
  const cursor = Math.max(0, Math.min(session.queue.length - 1, session.cursor + direction));
  return cursor === session.cursor ? session : { ...session, cursor };
}

function rememberWord(session, rating) {
  if (!['known', 'unknown'].includes(rating) || session.cursor >= session.queue.length) return session;
  return { ...session, ratings: { ...session.ratings, [session.queue[session.cursor]]: rating } };
}

// The requested direction is left = previous, right = next.
function swipeDirection(dx, dy) {
  return Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.35 ? Math.sign(dx) : 0;
}

  }

}

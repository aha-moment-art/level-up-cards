learnenglish.britishcouncil.org/free-resources/reading/b1/robot-teachers"}},{"date":"2026-10-31","label":"31","weekday":"周六","title":"LOOK HOW FAR. carry it into tomorrow.","first":2151,"last":2200,"page":"https://jeweled-rumba-883.notion.site/3e87234fb5e58110ad4de3a40c887335","episodes":[{"title":"Tech that refuses to die","source":"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2024/ep-241017","audio":"calendar-audio/2026-10-31-1.mp3"},{"title":"Did Taylor Swift fans cause an earthquake?","source":"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2024/ep-241010","audio":"calendar-audio/2026-10-31-2.mp3"}],"reading":{"title":"How to spot fake news","url":"https://learnenglish.britishcouncil.org/free-resources/reading/b1/how-spot-fake-news"}}],"words":[{"id":1,"word":"cancel","meaning":"取消， 废除； 抵消， 对消； 删去， 划掉","ukphone":"'kænsl","usphone":"'kænsl","collocation":"cancel a booking","example":"We had to cancel our booking because the train stopped running.","translation":"火车停运了，我们只好取消预订。","note":""},{"id":2,"word":"explosive","meaning":"爆炸的， 爆发的； 使人冲动的；爆炸物，炸药","ukphone":"ɪk'spləusɪv","usphone":"ɪk'splosɪv; ɪk'splozɪv","collocation":"explosive growth","example":"The town experienced explosive growth after the new railway opened.","translation":"新铁路开通后，这个城镇迅速发展。","note":""},{"id":3,"word":"prepare","meaning":"准备， 预备","ukphone":"prɪ'peə(r)","usphone":"prɪ'pɛr","collocation":"prepare for an exam","example":"Maya stayed home to prepare for her final exam.","translation":"玛雅留在家里准备期末考试。","note":""},{"id":4,"word":"crusade","meaning":"加入十字军， 投身正义运动；十字军；斗争，运动","ukphone":"kruː'seɪd","usphone":"kru'sed","collocation":"a crusade against waste","example":"The students began a crusade against food waste on campus.","translation":"学生们在校园发起了反对食物浪费的运动。","note":""},{"id":5,"word":"hamlet","meaning":"小村庄","ukphone":"'hæmlət","usphone":"'hæmlət","collocation":"a remote hamlet","example":"A narrow footpath connects the remote hamlet to the main road.","translation":"一条狭窄的小路把这个偏远村庄与大路连接起来。","note":""},{"id":6,"word":"surgeon","meaning":"外科医生","ukphone":"'sɜːdʒən","usphone":"'sɝdʒən","collocation":"a skilled surgeon","example":"The surgeon explained the procedure carefully before answering our questions.","translation":"外科医生仔细解释了手术流程，然后回答我们的问题。","note":""},{"id":7,"word":"hall","meaning":"门厅； 礼堂","ukphone":"hɔːl","usphone":"hɔl","collocation":"the entrance hall","example":"Please leave your wet umbrella in the entrance hall.","translation":"请把湿雨伞放在门厅。","note":""},{"id":8,"word":"discourage","meaning":"使泄气， 使灰心； 阻止， 劝阻","ukphone":"dɪs'kʌrɪdʒ","usphone":"dɪs'kɝɪdʒ","collocation":"discourage someone from doing","example":"One disappointing result should not discourage you from trying again.","translation":"一次令人失望的结果不该让你放弃再次尝试。","note":""},{"id":9,"word":"predispose","meaning":"事先影响某人； 偏爱； 易受感染","ukphone":"ˌpriːdɪ'spəuz","usphone":"'pridɪ'spoz","collocation":"predispose someone to","example":"Early success may predispose students to expect equally easy progress later.","translation":"早期的成功可能使学生倾向于期待以后也能轻松进步。","note":"常用义为“使倾向于；使易受某事影响”，不是主动“偏爱”。"},{"id":10,"word":"oversee","meaning":"监督， 监视； 俯瞰， 眺望","ukphone":"ˌəuvə'siː","usphone":"'ovɚ'si","collocation":"oversee a project","example":"An experienced engineer will oversee the bridge repair project.","translation":"一位经验丰富的工程师将监督桥梁维修项目。","note":"现代常用义是“监督、管理”；不宜将“俯瞰、眺望”作为常用义。"},{"id":11,"word":"pollution","meaning":"污染， 污染物； 玷污","ukphone":"pə'luːʃn","usphone":"pə'luʃən","collocation":"air pollution","example":"The city introduced cleaner buses to reduce air pollution.","translation":"这座城市引进了更清洁的公交车，以减少空气污染。","note":""},{"id":12,"word":"pretend","meaning":"装作， 假装","ukphone":"prɪ'tend","usphone":"prɪ'tɛnd","collocation":"pretend to be asleep","example":"I tried to pretend to be asleep when the children entered.","translation":"孩子们进来时，我试图装睡。","note":""},{"id":13,"word":"convection","meaning":"传送； 对流","ukphone":"kən'vekʃn","usphone":"kən'vɛkʃən","collocation":"convection currents","example":"The teacher used coloured water to demonstrate convection currents.","translation":"老师用有色水演示对流。","note":"核心义是“对流”，不是一般的“传送”。"},{"id":14,"word":"warrant","meaning":"保证；","ukphone":"'wɒrənt","usphone":"'wɔrənt","collocation":"warrant further investigation","example":"These unexpected results warrant further investigation before we publish.","translation":"这些意外结果值得进一步调查后再发表。","note":"补充动词“使有必要；使正当”，名词“搜查令、逮捕令；依据”。"},{"id":15,"word":"ecliptic","meaning":"【天】","ukphone":"ɪ'klɪptɪk","usphone":"ɪ'klɪptɪk","collocation":"the ecliptic plane","example":"The diagram shows Earth's orbit within the ecliptic plane.","translation":"这张图展示了地球在黄道平面内的轨道。","note":"补全：黄道；黄道的。"},{"id":16,"word":"conceal","meaning":"隐藏； 隐瞒； 掩盖","ukphone":"kən'siːl","usphone":"kən'sil","collocation":"conceal the truth","example":"The damaged label could not conceal the bottle's age.","translation":"破损的标签无法掩盖这个瓶子的年代。","note":""},{"id":17,"word":"overrate","meaning":"对…评价过高， 高估","ukphone":"ˌəuvə'reɪt","usphone":",ovɚ'ret","collocation":"overrate one's ability","example":"Beginners sometimes overrate their ability and choose routes that are too difficult.","translation":"初学者有时高估自己的能力，选择过于困难的路线。","note":""},{"id":18,"word":"meanwhile","meaning":"与此同时","ukphone":"'miːnwaɪl","usphone":"'minwaɪl","collocation":"meanwhile at home","example":"I watered the garden; meanwhile, my brother prepared lunch.","translation":"我给花园浇水；与此同时，弟弟准备午餐。","note":""},{"id":19,"word":"opulent","meaning":"豪华的， 华丽的， 富裕的； 丰富的， 丰饶的","ukphone":"'ɒpjələnt","usphone":"'ɑpjələnt","collocation":"an opulent interior","example":"The hotel's opulent interior contrasted with its plain stone exterior.","translation":"酒店豪华的内部与朴素的石质外观形成对比。","note":""},{"id":20,"word":"coincide","meaning":"同时发生； 一致","ukphone":"ˌkəuɪn'saɪd","usphone":",koɪn'saɪd","collocation":"coincide with","example":"My visit will coincide with the opening of the exhibition.","translation":"我到访的时间将恰逢展览开幕。","note":""},{"id":21,"word":"competent","meaning":" ities","example":"The programme aims to give all applicants an equal opportunity.","translation":"这个项目旨在给所有申请者平等的机会。","note":""},{"id":322,"word":"optometrist","meaning":"验光师， 视力测定者","ukphone":"ɒp'tɒmətrɪst","usphone":"ɑp'tɑmətrɪst","collocation":"visit an optometrist","example":"The optometrist asked me to read letters from a chart.","translation":"验光师让我读视力表上的字母。","note":""},{"id":323,"word":"silicon","meaning":"硅","ukphone":"'sɪlɪkən","usphone":"'sɪlɪkən","collocation":"a silicon chip","example":"The display explains how a silicon chip processes information.","translation":"该展板解释了硅芯片如何处理信息。","note":""},{"id":324,"word":"fund","meaning":"基金，专款；储备，蕴藏；；为…提供资金， 给…拨款","ukphone":"fʌnd","usphone":"fʌnd","collocation":"fund a project","example":"Local businesses agreed to fund repairs to the playground.","translation":"当地企业同意出资维修游乐场。","note":""},{"id":325,"word":"gravity","meaning":"重力","ukphone":"'grævəti","usphone":"ˈɡrævətɪ","collocation":"the force of gravity","example":"The lesson explored how gravity affects objects falling towards Earth.","translation":"这节课探讨了重力如何影响落向地球的物体。","note":""},{"id":326,"word":"moderation","meaning":"温和， 中庸； 适度， 合理","ukphone":"ˌmɒdə'reɪʃn","usphone":"'mɑdə'reʃən","collocation":"with moderation","example":"The chair led the heated debate with moderation and patience.","translation":"主席以克制与耐心主持了这场激烈的辩论。","note":""},{"id":327,"word":"recipient","meaning":"接受者","ukphone":"rɪ'sɪpiənt","usphone":"rɪ'sɪpɪənt","collocation":"an award recipient","example":"Each recipient of the award will give a short speech.","translation":"每位获奖者都将发表简短讲话。","note":""},{"id":328,"word":"commonwealth","meaning":"[the C-] 英联邦； 联合体","ukphone":"'kɒmənwelθ","usphone":"'kɑmən'wɛlθ","collocation":"the Commonwealth","example":"The lecture examined educational exchanges between members of the Commonwealth.","translation":"讲座研究了英联邦成员之间的教育交流。","note":""},{"id":329,"word":"marsupial","meaning":"有袋动物","ukphone":"mɑː'suːpiəl","usphone":"mɑr'supɪəl","collocation":"a small marsupia iable service","example":"A reliable bus service would help people working late shifts.","translation":"可靠的公交服务会帮助上晚班的人。","note":""},{"id":799,"word":"incentive","meaning":"刺激； 激励","ukphone":"ɪn'sentɪv","usphone":"ɪn'sɛntɪv","collocation":"a financial incentive","example":"The discount provides an incentive to book tickets early.","translation":"折扣为提前订票提供了动力。","note":""},{"id":800,"word":"relate","meaning":"有关联； 讲述， 叙述","ukphone":"rɪ'leɪt","usphone":"rɪ'let","collocation":"relate to","example":"Students often relate the novel's themes to their own experiences.","translation":"学生们经常把小说主题与自身经历联系起来。","note":""},{"id":801,"word":"workforce","meaning":"受雇的或现有的工作人员总数； 劳动人口","ukphone":"'wɜːkfɔːs","usphone":"'wɝkfɔrs","collocation":"a skilled workforce","example":"The company relies on a skilled workforce drawn from nearby towns.","translation":"公司依靠来自附近城镇的熟练劳动力。","note":""},{"id":802,"word":"preliminary","meaning":"开端的，预备的，初步的","ukphone":"prɪ'lɪmɪnəri","usphone":"prɪ'lɪmɪnɛri","collocation":"preliminary results","example":"The preliminary results suggest that the new design saves water.","translation":"初步结果表明，新设计能够节约用水。","note":""},{"id":803,"word":"obstacle","meaning":"障碍， 妨碍物， 干扰","ukphone":"'ɒbstəkl","usphone":"'ɑbstəkl","collocation":"overcome an obstacle","example":"Limited storage space was the biggest obstacle to expanding the shop.","translation":"储存空间有限是商店扩张的最大障碍。","note":""},{"id":804,"word":"fickle","meaning":"易变的， 无常的","ukphone":"'fɪkl","usphone":"'fɪkl","collocation":"fickle weather","example":"The coast's fickle weather makes outdoor events difficult to plan.","translation":"海岸天气多变，让户外活动难以规划。","note":""},{"id":805,"word":"van","meaning":"运货车","ukphone":"væn","usphone":"væn","collocation":"a delivery van","example":"The delivery van arrived outside the bakery before sunrise.","translation":"送货车在日出前到达面包店外。","note":""},{"id":806,"word":"worm","meaning":"虫， 蠕虫； 蜗杆， 螺纹","ukphone":"wɜːm","usphone":"wɝm","collocation":"an earthworm","example":"A worm wriggled throug itect","example":"The architect designed a courtyard that welcomes afternoon sunlight.","translation":"建筑师设计了一座能迎来午后阳光的庭院。","note":""},{"id":823,"word":"churn","meaning":"〔因紧张或惊慌而〕反胃；〔制造黄油的〕搅乳器","ukphone":"tʃɜːn","usphone":"tʃɝn","collocation":"a butter churn","example":"The museum volunteer demonstrated an old wooden butter churn.","translation":"博物馆志愿者演示了一个旧式木制搅乳器。","note":""},{"id":824,"word":"foundation","meaning":"基础； 地基； 创立","ukphone":"faun'deɪʃn","usphone":"faʊn'deʃən","collocation":"a solid foundation","example":"Regular reading provides a strong foundation for later academic work.","translation":"经常阅读为今后的学术学习奠定坚实基础。","note":""},{"id":825,"word":"astrology","meaning":"占星学； 占星术","ukphone":"ə'strɒlədʒi","usphone":"ə'strɑlədʒi","collocation":"the history of astrology","example":"The course examines the history of astrology in medieval Europe.","translation":"这门课研究中世纪欧洲的占星术历史。","note":""},{"id":826,"word":"variability","meaning":"可变性， 易变性","ukphone":"ˌveəriə'bɪləti","usphone":",vɛrɪə'bɪləti","collocation":"seasonal variability","example":"The study records seasonal variability in the lake's water level.","translation":"研究记录了湖泊水位的季节性变化。","note":""},{"id":827,"word":"invader","meaning":"入侵者","ukphone":"ɪn'veɪdə(r)","usphone":"ɪn'vedɚ","collocation":"repel an invader","example":"The castle exhibit describes the defences built against potential invaders.","translation":"城堡展览介绍了为抵御潜在入侵者修建的防御设施。","note":""},{"id":828,"word":"punch","meaning":"穿孔，打孔；重击，猛击；猛击； 冲床， 穿孔机； 力量， 效力","ukphone":"pʌntʃ","usphone":null,"collocation":"punch a hole","example":"Use this tool to punch a hole through the cardboard.","translation":"用这个工具在纸板上打一个孔。","note":""},{"id":829,"word":"naturally","meaning":"当然， 自然； 天生地","ukphone":"'nætʃrəli","usphone":"'nætʃrəli","collocation":"occur naturally","example":"The guide explained which plants occur naturally on the island.","translation":"向导解释了哪些植物是岛上天然生长的。","note":""},{"id":830,"word":"flexibility","meaning":"柔韧， 有弹性； 柔顺， 温顺； 灵活性； 适应性","ukphone":"ˌf lint tool","example":"Archaeologists found a worked piece of flint near the river.","translation":"考古学家在河边发现了一块加工过的燧石。","note":""},{"id":966,"word":"alignment","meaning":"排成直线； 联盟","ukphone":"ə'laɪnmənt","usphone":"ə'laɪnmənt","collocation":"wheel alignment","example":"The mechanic checked the wheel alignment after replacing the tyre.","translation":"机修工换好轮胎后检查了车轮定位。","note":"也常指“对齐、定位、校准”，如 wheel alignment“车轮定位”。"},{"id":967,"word":"thorny","meaning":"多刺的； 痛苦的， 棘手的","ukphone":"'θɔːni","usphone":"'θɔrni","collocation":"a thorny issue","example":"Sharing limited rehearsal space has become a thorny issue.","translation":"如何共用有限的排练空间已成为一个棘手问题。","note":""},{"id":968,"word":"exploitative","meaning":"开发的， 利用的； 剥削的","ukphone":"ɪk'splɔɪtətɪv","usphone":"ɪk'splɔɪtətɪv","collocation":"exploitative practices","example":"The documentary examines exploitative practices in parts of the clothing industry.","translation":"纪录片考察了服装行业部分领域的剥削行为。","note":"通常含“剥削性的；利用他人牟利的”贬义，不宜笼统理解为中性的“开发的”。"},{"id":969,"word":"private","meaning":"私人的； 私下的； 私立的","ukphone":"'praɪvət","usphone":"ˈpraɪvɪt","collocation":"a private collection","example":"The painting belongs to a private collection outside London.","translation":"这幅画属于伦敦以外的一处私人收藏。","note":""},{"id":970,"word":"technical","meaning":"技术的， 工艺的","ukphone":"'teknɪkl","usphone":"'tɛknɪkl","collocation":"technical support","example":"The venue provides technical support for visiting theatre groups.","translation":"场地为到访的剧团提供技术支持。","note":""},{"id":971,"word":"companion","meaning":"共事者； 同伴","ukphone":"kəm'pænɪən","usphone":"kəm'pænɪən","collocation":"a travelling companion","example":"My travelling companion suggested visiting the harbour before lunch.","translation":"我的旅伴建议午餐前去港口看看。","note":""},{"id":972,"word":"culminate","meaning":"告终； 结束","ukphone":"'kʌlmɪneɪt","usphone":"'kʌlmɪnet","collocation":"culminate in","example":"Months of rehearsal will culminate in a performance next Friday.","translation":"数月的排练将在下周五的演出中迎来高潮。","note":"补充关键义“达到高潮；以某 ing the volunteers' weekly rota.","translation":"她负责安排志愿者每周的轮班表。","note":""},{"id":981,"word":"linen","meaning":"亚麻织品； 亚麻布","ukphone":"'lɪnɪn","usphone":"'lɪnɪn","collocation":"a linen tablecloth","example":"The café uses linen napkins instead of disposable paper ones.","translation":"咖啡馆使用亚麻餐巾，取代一次性纸餐巾。","note":""},{"id":982,"word":"bullet","meaning":"枪弹， 子弹","ukphone":"'bulɪt","usphone":"'bʊlɪt","collocation":"a bullet hole","example":"The museum guide pointed out a bullet hole in the armour.","translation":"博物馆导游指出了盔甲上的一个弹孔。","note":""},{"id":983,"word":"illuminate","meaning":"照亮； 阐明， 解释； 启发","ukphone":"ɪ'luːmɪneɪt","usphone":"ɪ'lumɪnet","collocation":"illuminate a room","example":"Small lamps illuminate the path through the sculpture garden.","translation":"小灯照亮了雕塑花园中的小路。","note":""},{"id":984,"word":"unquote","meaning":"结束引语","ukphone":"ˌʌn'kwəut","usphone":",ʌn'kwot","collocation":"quote ... unquote","example":"He called the three-hour wait, quote, a minor delay, unquote.","translation":"他称那三个小时的等候——原话是——“一点小延误”。","note":""},{"id":985,"word":"protrude","meaning":"伸出； 突出","ukphone":"prə'truːd","usphone":"pro'trud","collocation":"protrude from","example":"Several nails protrude from the old wooden fence.","translation":"旧木栅栏上有几颗钉子凸了出来。","note":""},{"id":986,"word":"slippery","meaning":"滑的， 滑溜的； 油滑的， 狡猾的； 棘手的","ukphone":"'slɪpəri","usphone":"'slɪpəri","collocation":"a slippery surface","example":"The stone steps become slippery after heavy rain.","translation":"大雨过后，石阶会变得湿滑。","note":""},{"id":987,"word":"significance","meaning":"重要性， 意义","ukphone":"sɪg'nɪfɪkəns","usphone":"sɪɡ'nɪfɪkəns","collocation":"historical significance","example":"The guide explained the historical significance of the abandoned railway.","translation":"导游解释了这条废弃铁路的历史意义。","note":""},{"id":988,"word":"forum","meaning":"论坛； 讨论会","ukphone":"'fɔːrəm","usphone":"'fɔrəm","collocation":"a public forum","example":"The council organised a forum to discuss the proposed library closure.","translation": ults.","translation":"灵活的课表使这门课对在职成年人很有吸引力。","note":""},{"id":1181,"word":"cater","meaning":"提供饮食； 迎合； 满足需要","ukphone":"'keɪtə(r)","usphone":"'ketɚ","collocation":"cater for groups","example":"The café can cater for small groups with advance notice.","translation":"如果提前通知，咖啡馆可以为小团体提供餐食。","note":""},{"id":1182,"word":"superb","meaning":"极好的； 高质量的","ukphone":"sʊː'pɜːb","usphone":"suːˈpɜːrb","collocation":"a superb performance","example":"The young orchestra gave a superb performance despite limited rehearsal time.","translation":"尽管排练时间有限，年轻的乐团仍带来了一场精彩演出。","note":""},{"id":1183,"word":"duplicate","meaning":"完全相同的；副本的；复制，复写；重复['djuːplɪkət]；复制品","ukphone":"'djuːplɪkeɪt","usphone":"'duplɪket","collocation":"a duplicate copy","example":"Keep a duplicate copy of the completed registration form.","translation":"请留存一份填好的登记表副本。","note":""},{"id":1184,"word":"decrease","meaning":"减少，减小['dɪːkriːs]；减少； 减少量","ukphone":"dɪ'kriːs","usphone":"dɪ'kris","collocation":"a steady decrease","example":"The report records a decrease in packaging waste this year.","translation":"报告记录了今年包装废弃物的减少。","note":""},{"id":1185,"word":"glossary","meaning":"词汇表； 术语表","ukphone":"'glɒsərɪ","usphone":"'ɡlɑsəri","collocation":"a useful glossary","example":"The book includes a glossary of unfamiliar botanical terms.","translation":"这本书附有一份生僻植物学术语的词汇表。","note":""},{"id":1186,"word":"flutter","meaning":"振， 拍打； 飘动， 晃动； 跳动","ukphone":"'flʌtə(r)","usphone":"'flʌtɚ","collocation":"flutter in the breeze","example":"Paper flags began to flutter above the crowded market.","translation":"纸旗开始在拥挤的市场上方飘动。","note":""},{"id":1187,"word":"ignorance","meaning":"无知， 愚昧； 不知道","ukphone":"'ɪgnərəns","usphone":"'ɪɡnərəns","collocation":"ignorance of","example":"His mistakes revealed ignorance of the town's complex history.","translation":"他的错误表明他不了解这个镇复杂的历史。","note":""},{"id":1188,"word":"afflicting","meaning":"痛苦的","ukphone":"ə'flɪktɪŋ","usphone":"ə'fliktiŋ","collocation":"problems afflicting a community","example":"The report piece of string","example":"We tied the paper labels on with short pieces of string.","translation":"我们用几段短绳把纸标签系了上去。","note":""},{"id":1197,"word":"affluent","meaning":"丰富的， 富裕的","ukphone":"'æflʊənt","usphone":"'æfluənt","collocation":"an affluent suburb","example":"The study compares housing in affluent suburbs and poorer districts.","translation":"研究比较了富裕郊区与较贫困地区的住房。","note":""},{"id":1198,"word":"simplicity","meaning":"简单， 简易； 朴素； 直率， 单纯","ukphone":"sɪm'plɪsəti","usphone":"sɪm'plɪsəti","collocation":"elegant simplicity","example":"The room's simplicity made the colourful paintings stand out.","translation":"房间的简洁让那些彩色画作格外突出。","note":""},{"id":1199,"word":"summit","meaning":"最高点， 峰顶","ukphone":"'sʌmɪt","usphone":"'sʌmɪt","collocation":"reach the summit","example":"We reached the summit just before the clouds rolled in.","translation":"我们在云层涌来前刚好到达了山顶。","note":""},{"id":1200,"word":"magnify","meaning":"放大， 扩大","ukphone":"'mægnɪfaɪ","usphone":"'mæɡnɪfaɪ","collocation":"magnify an image","example":"The lens can magnify small details on the printed map.","translation":"这枚透镜可以放大印刷地图上的细节。","note":""},{"id":1201,"word":"redundant","meaning":"被解雇的； 多余的， 过剩的； 累赘的， 冗长的","ukphone":"rɪ'dʌndənt","usphone":"rɪ'dʌndənt","collocation":"redundant equipment","example":"We sold the redundant equipment after closing our second workshop.","translation":"关闭第二间车间后，我们卖掉了多余的设备。","note":""},{"id":1202,"word":"vested","meaning":"法律规定的； 既定的","ukphone":"'vestɪd","usphone":"'vɛstɪd","collocation":"vested interest","example":"The developer has a vested interest in the road project.","translation":"这家开发商在道路项目中有既得利益。","note":""},{"id":1203,"word":"conclusion","meaning":"结论， 推论； 结束， 结尾； 【法】 缔结， 议定","ukphone":"kən'kluːʒn","usphone":"kən'kluʒn","collocation":"reach a conclusion","example":"We cannot reach a conclusion without examining the original records.","translation":"不检查原始记录，我们就无法得出结论。","note":""},{"id":1204,"word":"durable","meaning":"耐用的","ukphone":"'djuərəbl","usphone":"'dʊrəbl","collocati ":"'skʌlptʃɚ","collocation":"bronze sculpture","example":"A bronze sculpture stands beside the entrance to the gallery.","translation":"美术馆入口旁矗立着一座青铜雕塑。","note":""},{"id":1213,"word":"manipulative","meaning":"操纵别人的； 老于世故的","ukphone":"mə'nɪpjələtɪv","usphone":"mə'nɪpjəletɪv","collocation":"manipulative behaviour","example":"His manipulative behaviour gradually damaged the trust within our team.","translation":"他操控他人的行为逐渐损害了团队内部的信任。","note":""},{"id":1214,"word":"wax","meaning":"给…上蜡， 给…打蜡； 渐圆， 渐满；蜡；蜂蜡","ukphone":"wæks","usphone":"waks","collocation":"candle wax","example":"Warm candle wax dripped onto the table during dinner.","translation":"晚餐时，温热的烛蜡滴到了桌上。","note":""},{"id":1215,"word":"arable","meaning":"可耕作的；耕地","ukphone":"'ærəbl","usphone":"'ærəbl","collocation":"arable land","example":"The village lost valuable arable land when the reservoir expanded.","translation":"水库扩建时，这个村庄失去了宝贵的耕地。","note":""},{"id":1216,"word":"sensation","meaning":"感觉能力； 感觉， 知觉； 轰动， 引起轰动的事件","ukphone":"sen'seɪʃn","usphone":"sɛn'seʃən","collocation":"a strange sensation","example":"The moving walkway gave me a strange sensation of floating.","translation":"自动人行道让我产生了一种奇怪的漂浮感。","note":""},{"id":1217,"word":"urban","meaning":"都市的； 住在都市的","ukphone":"'ɜːbən","usphone":"'ɝbən","collocation":"urban development","example":"The exhibition examines how urban development has changed local rivers.","translation":"这个展览探讨城市开发如何改变了当地河流。","note":""},{"id":1218,"word":"refer","meaning":"参考， 查阅， 查询； 提到， 谈及； 引用； 提交， 上呈","ukphone":"rɪ'fɜː(r)","usphone":"rɪ'fɝ","collocation":"refer to","example":"Please refer to the diagram when assembling the wooden frame.","translation":"组装木框时，请参照这张示意图。","note":""},{"id":1219,"word":"departmental","meaning":"部门的","ukphone":"ˌdiːpɑːt'mentl","usphone":",dipɑrt'mɛntl","collocation":"departmental meeting","example":"We discussed the new timetable at our weekly departmental meeting.","translation":"我们在每周的部门会议上讨论了新的时间表。","note":""},{"id":1220,"word":"flame","meaning":"发火焰， 燃烧；火焰；强烈的感情","ukphone":"fleɪm","usphone":"flem","collocation":"a small flame","example":"A small flame flickered inside the lantern beside our tent.","translation":"帐篷旁的灯笼里，一小簇火苗在闪烁。","note":""},{"id":1221,"word":"melatonin","meaning":"褪黑激素","ukphone":"ˌmelə'təunɪn","usphone":",mɛlə'tonɪn","collocation":"melatonin levels","example":"The research team measured melatonin levels at different times.","translation":"研究团队测量了不同时间的褪黑激素水平。","note":""},{"id":1222,"word":"discard","meaning":"丢弃， 遗弃","ukphone":"dɪs'kɑːd","usphone":"dɪsˈkɑːrd","collocation":"discard old papers","example":"Please discard the damaged labels before packing the remaining jars.","translation":"包装剩余罐子之前，请丢弃破损的标签。","note":""},{"id":1223,"word":"subsidy","meaning":"津贴， 补助金","ukphone":"'sʌbsədi","usphone":"'sʌbsədi","collocation":"government subsidy","example":"A government subsidy helped the village restore its bus service.","translation":"政府补助帮助这个村庄恢复了公交服务。","note":""},{"id":1224,"word":"obscene","meaning":"淫秽的， 猥亵的， 下流的； 可憎的， 可恶的； 大得惊人的， 骇人听闻的","ukphone":"əb'siːn","usphone":"əb'sin","collocation":"obscene profits","example":"Residents accused the company of making obscene profits from housing.","translation":"居民指责这家公司通过住房牟取巨额暴利。","note":""},{"id":1225,"word":"prohibitive","meaning":"禁止的， 抑制的； 令人望而却步的","ukphone":"prə'hɪbətɪv","usphone":"prə'hɪbətɪv","collocation":"prohibitive cost","example":"The prohibitive cost of repairs forced us to replace the printer.","translation":"高得令人却步的维修费用迫使我们更换打印机。","note":""},{"id":1226,"word":"attentive","meaning":"注意的， 专心的； 关心的， 体贴的； 留意的","ukphone":"ə'tentɪv","usphone":"ə'tɛntɪv","collocation":"attentive listener","example":"An attentive listener notices when a speaker hesitates or changes tone.","translation":"专心的听众会注意到说话者的犹豫或语气变化。","note":""},{"id":1227,"word":"merchandising","meaning":"销售规划","ukphone":"'mɜːtʃəndaɪzɪŋ","usphone":"'mɝtʃəndaɪzɪŋ","collocation":"visual merchandising","example":"Her course in visual merchandising included designing attractive window displays.", es that are easy to clean.","translation":"厨房里装有易于清洁的不锈钢架子。","note":""},{"id":1236,"word":"consequential","meaning":"结果的， 随之发生的","ukphone":"ˌkɒnsɪ'kwenʃl","usphone":"'kɑnsə'kwɛnʃəl","collocation":"consequential changes","example":"The committee debated consequential changes to the university's admissions system.","translation":"委员会讨论了大学招生制度中影响重大的变革。","note":"补充：consequential也可表示“重要的，影响重大的”。"},{"id":1237,"word":"metro","meaning":"地下铁路","ukphone":"'metrəu","usphone":"'mɛtro","collocation":"take the metro","example":"We decided to take the metro rather than drive downtown.","translation":"我们决定乘地铁去市中心，而不是开车。","note":""},{"id":1238,"word":"prevail","meaning":"流行， 盛行； 占优势， 战胜","ukphone":"prɪ'veɪl","usphone":"pri'vel","collocation":"prevail over","example":"Patience and careful planning eventually prevailed over our initial difficulties.","translation":"耐心和周密计划最终帮助我们克服了最初的困难。","note":""},{"id":1239,"word":"tranquility","meaning":"宁静， 安静","ukphone":"træŋ'kwɪləti","usphone":null,"collocation":"a sense of tranquility","example":"The empty garden offered a sense of tranquility after work.","translation":"下班后，空无一人的花园带来了一份宁静。","note":""},{"id":1240,"word":"minimise","meaning":"使减到最低限度； 最小化","ukphone":"'mɪnɪmaɪz","usphone":"'minimaiz","collocation":"minimise waste","example":"Careful measurements help us minimise waste when cutting expensive fabric.","translation":"裁剪昂贵面料时，仔细测量有助于尽量减少浪费。","note":""},{"id":1241,"word":"browse","meaning":"吃嫩叶或草；浏览；嫩叶， 嫩芽； 吃草； 浏览","ukphone":"brauz","usphone":"braʊz","collocation":"browse the shelves","example":"I like to browse the shelves before choosing a novel.","translation":"挑选小说前，我喜欢先浏览书架上的书。","note":""},{"id":1242,"word":"intensify","meaning":"使增强； 使加剧","ukphone":"ɪn'tensɪfaɪ","usphone":"ɪn'tɛnsɪfaɪ","collocation":"intensify efforts","example":"The council plans to intensify efforts to protect historic buildings.","translation":"市议会计划加大保护历史建筑的力度。","note":""},{"id":1243,"word":"portion","meaning":"部分；一份；划分， 分配","ukphone":"'pɔːʃn","usphone":"'p I still have faith in her ability to finish the project.","translation":"我仍然相信她有能力完成这个项目。","note":""},{"id":1300,"word":"remark","meaning":"评论，谈论；注意到，","ukphone":"rɪ'mɑːk","usphone":"rɪ'mɑrk","collocation":"a brief remark","example":"His brief remark prompted a much longer discussion after class.","translation":"他简短的一句话引发了课后更长时间的讨论。","note":"补充名词义：评论，话语。"},{"id":1301,"word":"sluttish","meaning":"懒惰的， 邋遢的； 放荡的","ukphone":"'slʌtɪʃ","usphone":"'slʌtiʃ","collocation":"sluttish habits","example":"The novel's sluttish housekeeper leaves dirty plates in every room.","translation":"小说里那个邋遢的女管家把脏盘子留得到处都是。","note":"用法提示：sluttish带贬义且较陈旧，用来形容人可能冒犯对方。"},{"id":1302,"word":"microscope","meaning":"显微镜","ukphone":"'maɪkrəskəup","usphone":"'maɪkrəskop","collocation":"under a microscope","example":"We examined a thin onion skin under a microscope.","translation":"我们用显微镜观察了一层薄薄的洋葱表皮。","note":""},{"id":1303,"word":"necessarily","meaning":"必要地； 必然地","ukphone":"'nesəsərəli; ˌnesə'serəli","usphone":",nɛsə'sɛrəli","collocation":"not necessarily","example":"A higher price does not necessarily guarantee better sound quality.","translation":"价格更高并不一定保证音质更好。","note":""},{"id":1304,"word":"candidate","meaning":"候选人， 候补者； 申请求职者； 报考者","ukphone":"'kændɪdət","usphone":"ˈkændɪˌdet, -dɪt","collocation":"a suitable candidate","example":"The panel interviewed each suitable candidate for the research position.","translation":"评审小组面试了这份研究岗位的每位合适候选人。","note":""},{"id":1305,"word":"postgraduate","meaning":"研究生","ukphone":"ˌpəust'grædʒʊət","usphone":"post'ɡrædjet","collocation":"a postgraduate student","example":"A postgraduate student helped us locate the original survey data.","translation":"一名研究生帮助我们找到了原始调查数据。","note":""},{"id":1306,"word":"inversion","meaning":"倒置， 颠倒","ukphone":"ɪn'vɜːʃn","usphone":"ɪn'vɝʃən","collocation":"temperature inversion","example":"A temperature inversion trapped mist over the valley that morning.","translation":"那天早上，逆温现象使雾滞留在山谷上方。","note":""},{"id":1307,"word":"intelligible", one":"i'mɪt","usphone":"ɪ'mɪt","collocation":"emit light","example":"The small lamp can emit light for several hours.","translation":"这盏小灯可以连续发光数小时。","note":""},{"id":1796,"word":"cosy","meaning":"舒适的， 安逸的","ukphone":"'kəuzi","usphone":"ˈkozi","collocation":"a cosy room","example":"The inn offered a cosy room overlooking the snowy garden.","translation":"旅店提供了一间俯瞰雪中花园的舒适客房。","note":""},{"id":1797,"word":"intend","meaning":"想要， 打算","ukphone":"ɪn'tend","usphone":"ɪn'tɛnd","collocation":"intend to","example":"We intend to finish the survey before the summer holidays.","translation":"我们打算在暑假前完成调查。","note":""},{"id":1798,"word":"snap","meaning":"咔嚓折断，啪地绷断；打开；咬；厉声说话，怒声责斥；突然的， 匆忙的；咔嚓声","ukphone":"snæp","usphone":"snæp","collocation":"snap in half","example":"The thin branch began to snap under the heavy snow.","translation":"细树枝在沉重积雪下开始折断。","note":""},{"id":1799,"word":"flicker","meaning":"闪烁； 一闪而过","ukphone":"'flɪkə(r)","usphone":"'flɪkɚ","collocation":"flicker in the wind","example":"The candle continued to flicker in the evening breeze.","translation":"蜡烛在晚风中不停闪烁。","note":""},{"id":1800,"word":"numerous","meaning":"众多的","ukphone":"'njuːmərəs","usphone":"'numərəs","collocation":"numerous examples","example":"The guide includes numerous examples of common printing mistakes.","translation":"这本指南包含了大量常见印刷错误的例子。","note":""},{"id":1801,"word":"govern","meaning":"统治， 管理； 控制， 支配","ukphone":"'gʌvn","usphone":"'ɡʌvɚn","collocation":"govern behaviour","example":"Shared rules govern behaviour in the communal workshop.","translation":"共同的规则规范着公共工作坊内的行为。","note":""},{"id":1802,"word":"spacious","meaning":"宽广的， 宽敞的","ukphone":"'speɪʃəs","usphone":"'speʃəs","collocation":"a spacious room","example":"The spacious room easily accommodated all twenty workshop participants.","translation":"这间宽敞的房间轻松容纳了工作坊的全部二十名参与者。","note":""},{"id":1803,"word":"analyse","meaning":"分析； 分解","ukphone":"'ænəlaɪz","usphone":"'æn(ə)laɪz","collocation":"analyse the results","example":"We will analyse the results after collecting all the questionnaires.","translation":"收齐全部问卷后，我们将分析结果。","note":""},{"id":1804,"word":"resemble","meaning":"与…相似， 像","ukphone":"rɪ'zembl","usphone":"rɪ'zɛmbl","collocation":"closely resemble","example":"The new building closely resembles the original railway station.","translation":"新建筑与原来的火车站十分相似。","note":""},{"id":1805,"word":"cafeteria","meaning":"自助餐馆； 自助食堂","ukphone":"ˌkæfə'tɪəriə","usphone":",kæfə'tɪrɪə","collocation":"a school cafeteria","example":"The school cafeteria serves hot meals until two o'clock.","translation":"学校食堂供应热餐到两点。","note":""},{"id":1806,"word":"remote","meaning":"远的， 长久的； 遥远的， 偏僻的； 远程的； 关系疏远的， 脱离的； 绝少的， 微乎其微的； 孤高的， 冷淡的","ukphone":"rɪ'məut","usphone":"rɪ'mot","collocation":"a remote village","example":"The narrow road leads to a remote village in the mountains.","translation":"这条狭窄的公路通向山里一个偏远的村庄。","note":""},{"id":1807,"word":"hiccup","meaning":"打嗝；嗝，呃逆；暂时困难","ukphone":"'hɪkʌp","usphone":"'hɪkəp","collocation":"a minor hiccup","example":"A minor hiccup with the projector delayed the presentation.","translation":"投影仪出了点小故障，推迟了展示。","note":""},{"id":1808,"word":"afflict","meaning":"使苦恼； 折磨","ukphone":"ə'flɪkt","usphone":"ə'flɪkt","collocation":"afflict a community","example":"Persistent water shortages continue to afflict the small farming community.","translation":"持续缺水仍然困扰着这个小型农业社区。","note":""},{"id":1809,"word":"fluctuate","meaning":"涨落， 起伏； 变化","ukphone":"'flʌktjʊeɪt","usphone":"'flʌktʃʊ'et","collocation":"fluctuate widely","example":"Ticket prices fluctuate widely depending on the time of year.","translation":"票价会随一年中的不同时段大幅波动。","note":""},{"id":1810,"word":"calculate","meaning":"计算， 推算； 估计， 推测； 计划， 打算","ukphone":"'kælkjʊleɪt","usphone":"'kælkjulet","collocation":"calculate the cost","example":"We need to calculate the total cost before ordering materials.","translation":"订购材料之前，我们需要算出总费用。","note":""},{"id":1811,"word":"glutamate","meaning":"谷氨酸； 谷酸盐","ukphone":"'gluːtəmeɪt","usphone":"'ɡlʊtə,met","collocation":"monosodium glutamate","example":"The ingredient list includes monosodium glutamate and several dried spices.","translation":"配料表中列有谷氨酸钠和几种干香料。","note":"精确化：glutamate指谷氨酸盐或酯；谷氨酸本身为glutamic acid。原文“谷酸盐”应为“谷氨酸盐”。"},{"id":1812,"word":"possess","meaning":"具有； 拥有","ukphone":"pə'zes","usphone":"pə'zɛs","collocation":"possess a skill","example":"Applicants should possess basic computer skills and clear handwriting.","translation":"申请人应当具备基本电脑技能，字迹清晰。","note":""},{"id":1813,"word":"neutral","meaning":"中立的； 无明显特性的","ukphone":"'njuːtrəl","usphone":"'nʊtrəl","collocation":"a neutral colour","example":"We painted the walls a neutral colour to suit different exhibitions.","translation":"我们把墙刷成了中性色，以适应不同展览。","note":""},{"id":1814,"word":"optional","meaning":"可选择的， 非强制的， 随意的","ukphone":"'ɒpʃənl","usphone":"'ɑpʃənl","collocation":"an optional module","example":"Photography is an optional module in the first year.","translation":"摄影是第一学年的一门选修课程。","note":""},{"id":1815,"word":"analysis","meaning":"分析； 分解","ukphone":"ə'næləsɪs","usphone":"ə'næləsɪs","collocation":"detailed analysis","example":"A detailed analysis of the figures revealed several unusual patterns.","translation":"对数字的详细分析揭示了几种异常规律。","note":""},{"id":1816,"word":"devise","meaning":"设计， 发明","ukphone":"dɪ'vaɪz","usphone":"dɪ'vaɪz","collocation":"devise a plan","example":"The students worked together to devise a practical recycling plan.","translation":"学生们合作设计了一项切实可行的回收计划。","note":""},{"id":1817,"word":"apparent","meaning":"显然的； 表面上的","ukphone":"ə'pærənt","usphone":"ə'pærənt","collocation":"become apparent","example":"The scale of the damage became apparent in daylight.","translation":"到了白天，损坏的严重程度显现出来。","note":""},{"id":1818,"word":"journalist","meaning":"新闻工作者， 新闻记者","ukphone":"'dʒɜːnəlɪst","usphone":"ˈdʒɝ​nlɪst","collocation":"a local journalist","example":"A local journalist interviewed the volunteers about their restoration work.","translation":"一位当地记者采访了志愿者，了解他们的修复工作。","note":""},{"id":1819,"word":"correlation","meaning":"相互关系， 相关","ukphone":"ˌkɒrə'leɪʃn","usphone":",kɔrə'leʃən","collocation":"a strong correlation","example":"The study found a strong correlation between rainfall and river levels.","translation":"这项研究发现，降雨量与河流水位高度相关。","note":""},{"id":1820,"word":"exposure","meaning":"暴露； 显露； 接触； 曝光","ukphone":"ɪk'spəuʒə(r)","usphone":"ɪk'spoʒɚ","collocation":"exposure to sunlight","example":"Prolonged exposure to sunlight caused the old photographs to fade.","translation":"长时间暴露在阳光下使老照片褪色了。","note":""},{"id":1821,"word":"clutch","meaning":"离合器；","ukphone":"klʌtʃ","usphone":"klʌtʃ","collocation":"release the clutch","example":"He slowly released the clutch as the car moved uphill.","translation":"汽车往坡上行驶时，他慢慢松开了离合器。","note":""},{"id":1822,"word":"evacuate","meaning":"疏散； 撤离","ukphone":"ɪ'vækjʊeɪt","usphone":"ɪ'vækjuet","collocation":"evacuate a building","example":"Staff practised how to evacuate the building during a drill.","translation":"员工在演练中练习了如何撤离大楼。","note":""},{"id":1823,"word":"externally","meaning":"外表上， 外形上","ukphone":"ɪk'stɜːnəli","usphone":"ɪk'stɝnli","collocation":"externally funded","example":"The externally funded project allowed students to join the research team.","translation":"这个由外部资助的项目让学生得以加入研究团队。","note":"补充：externally也表示“从外部，在外部”。"},{"id":1824,"word":"grope","meaning":"摸索","ukphone":"grəup","usphone":"ɡrop","collocation":"grope for","example":"In the darkness, I had to grope for the door handle.","translation":"黑暗中，我不得不摸索着寻找门把手。","note":""},{"id":1825,"word":"humble","meaning":"谦逊的，谦虚的；地位低下的，卑贱的；简陋的，低劣的；使谦恭； 使卑下； 贬低","ukphone":"'hʌmbl","usphone":"'hʌmbl","collocation":"remain humble","example":"Despite winning several awards, she remained humble about her achievements.","translation":"虽然获得了几个奖项，她对自己的成就仍然保持谦逊。","note":""},{"id":1826,"word":"flight","meaning":"航班","ukphone":"flaɪt","usphone":"flaɪt","collocation":"a delayed flight","example":"Our delayed flight meant arriving well after the hotel reception closed.","translation":"航班延误意味着我们到达时，酒店前台早已关门。","note":""},{"id":1827,"word":"harbour","meaning":"停泊； 隐匿；港湾","ukphone":"'hɑːbə(r)","usphone":"hɑrbɚ","collocation":"a sheltered harbour","example":"The fishing boats returned to the sheltered harbour before the storm.","translation":"暴风雨来临前，渔船回到了避风港。","note":""},{"id":1828,"word":"commodity","meaning":"商品， 货物； 日用品","ukphone":"kə'mɒdəti","usphone":"kə'mɑdəti","collocation":"a valuable commodity","example":"Fresh water became a valuable commodity during the prolonged drought.","translation":"长期干旱期间，淡水成了宝贵的商品。","note":""},{"id":1829,"word":"cloakroom","meaning":"衣帽间； 〈英〉洗手间","ukphone":"'kləukruːm","usphone":"'klokrum","collocation":"leave in the cloakroom","example":"You can leave your coat in the cloakroom downstairs.","translation":"你可以把外套放在楼下的衣帽间。","note":""},{"id":1830,"word":"independent","meaning":"独立的，自主的，不受约束的；中立派， 无党派议员","ukphone":"ˌɪndɪ'pendənt","usphone":"'ɪndɪ'pɛndənt","collocation":"independent research","example":"The final assignment requires students to conduct independent research.","translation":"最后一项作业要求学生开展独立研究。","note":""},{"id":1831,"word":"defence","meaning":"防御，保护；辩护；答辩；","ukphone":"dɪ'fens","usphone":"di'fens","collocation":"a line of defence","example":"The sea wall forms a vital line of defence against flooding.","translation":"这道海堤构成抵御洪水的重要防线。","note":""},{"id":1832,"word":"glossy","meaning":"有光泽的， 光滑的","ukphone":"'glɒsi","usphone":"'ɡlɑsi","collocation":"glossy paper","example":"The photographs were printed on thick, glossy paper.","translation":"这些照片印在厚实的光面纸上。","note":""},{"id":1833,"word":"prefabricate","meaning":"预制构件","ukphone":"ˌpriː'fæbrɪkeɪt","usphone":"pri'fæbrə,ket","collocation":"prefabricate components","example":"The company will prefabricate the wall panels at its factory.","translation":"公司将在工厂预制墙板。","note":""},{"id":1834,"word":"plausible","meaning":"似有道理的， 貌似真实的； 嘴巧的","ukphone":"'plɔːzəbl","usphone":"'plɔzəbl","collocation":"a plausible explanation","example":"The technician offered a plausible explanation for the strange noise.","tran function restoreSession(ids, saved) {
  const fresh = { signature: ids.join(','), mode: 'learn', queue: [...ids], cursor: 0, ratings: {} };
  if (!saved || saved.signature !== fresh.signature) return fresh;
  const validQueue = Array.isArray(saved.queue) && saved.queue.length > 0 &&
    new Set(saved.queue).size === saved.queue.length && saved.queue.every(id => ids.includes(id));
  const validMode = validQueue && (saved.mode === 'review' || (saved.mode === 'learn' && saved.queue.join(',') === fresh.signature));
  if (!validQueue || !validMode || !Number.isInteger(saved.cursor) || saved.cursor < 0 || saved.cursor > saved.queue.length) return fresh;
  const ratings = {};
  for (const id of ids) if (['known', 'unknown'].includes(saved.ratings?.[id])) ratings[id] = saved.ratings[id];
  return { ...fresh, mode: saved.mode, queue: [...saved.queue], cursor: saved.cursor, ratings };

  const id = session.queue[session.cursor];

}

  return queue.length ? { ...session, mode: 'review', queue, cursor: 0 } : session;
}

  const cursor = Math.max(0, Math.min(session.queue.length - 1, session.cursor + direction));
  return cursor === session.cursor ? session : { ...session, cursor };

  const error=document.createElement('p');error.className='audio-error';error.hidden=true;error.textContent='暂时无法播放，可打开 BBC 本集页面收听。';player.addEventListener('error',()=>error.hidden=false);player.addEventListener('play',()=>{playRequest++;requestedPlayback=false;document.querySelectorAll('audio').forEach(a=>{if(a!==player)a.pause()});error.hidden=true});
  const links=document.createElement('div');links.className='episode-links';links.append(link('BBC 本集内容 ↗',episode.source));
  article.append(source,title,player,error,links);$('#episodes').append(article);
 });
 $('#pdf-access').replaceChildren(link('当天原文与练习 PDF ↗',day.page));
 $('#reading-link').textContent=day.reading.title+' ↗';$('#reading-link').href=day.reading.url;
 renderWord();if(updateURL){const url=new URL(location.href);url.searchParams.set('date',date);history.replaceState(null,'',url)}
}
const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
tabs.forEach((b,i)=>{if(b.dataset.date===today)b.dataset.today='true';b.addEventListener('click',()=>selectDate(b.dataset.date));b.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();tabs[n].focus();selectDate(tabs[n].dataset.date)})});
$('#word').addEventListener('click',playWord);$('#speaker').addEventListener('click',playWord);
$('#flip').addEventListener('click',()=>flip(!flipped));$('#previous').addEventListener('click',()=>navigate(-1));$('#next').addEventListener('click',()=>navigate(1));
document.querySelectorAll('[data-accent]').forEach(b=>b.addEventListener('click',()=>{accent=b.dataset.accent;write('ielts-daily-accent-v1',accent);prepareAudio()}));
document.querySelectorAll('[data-rating]').forEach(b=>b.addEventListener('click',()=>{const wasFlipped=flipped;session=rememberWord(session,b.dataset.rating);const saved=read('ielts-word-progress-v1',[]);const mastered=new Set(Array.isArray(saved)?saved:[]);b.dataset.rating==='known'?mastered.add(current().id):mastered.delete(current().id);write('ielts-word-progress-v1',[...mastered]);renderWord();flip(wasFlipped)}));
$('#review').addEventListener('click',()=>{session=reviewWords(session,ids);renderWord()});$('#all-words').addEventListener('click',()=>{session={...session,mode:'learn',queue:[...ids],cursor:0};renderWord()});
const card=$('#word-card');card.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation();return}if(!e.target.closest('button,summary,details,a'))flip(!flipped)},true);
card.addEventListener('keydown',e=>{if(e.target.closest('button,summary,details,a'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();navigate(e.key==='ArrowLeft'?-1:1)}else if(e.target===card&&(e.key===' '||e.key==='Enter')){e.preventDefault();flip(!flipped)}});
card.addEventListener('pointerdown',e=>{if(!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,horizontal:false};suppressUntil=0});
card.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.horizontal&&Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){gesture=null;return}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.35){gesture.horizontal=true;if(!card.hasPointerCapture(e.pointerId))card.setPointerCapture(e.pointerId);e.preventDefault()}});
card.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);if(!g.horizontal)return;suppressUntil=performance.now()+400;e.preventDefault();const dir=swipeDirection(e.clientX-g.x,e.clientY-g.y);if(dir)navigate(dir)});
card.addEventListener('pointercancel',()=>gesture=null);card.addEventListener('lostpointercapture',e=>{if(e.target===card&&gesture?.id===e.pointerId)gesture=null});
audio.addEventListener('canplay',prefetchUpcoming);
audio.addEventListener('waiting',()=>{if(requestedPlayback)$('#audio-status').textContent='正在加载发音…'});
audio.addEventListener('playing',()=>{if(requestedPlayback&&!audio.paused)$('#audio-status').textContent=`正在播放${accent==='uk'?'英音':'美音'}`});
audio.addEventListener('ended',()=>{if(audio.ended){requestedPlayback=false;$('#audio-status').textContent='播放完毕 · 可再次点读'}});
audio.addEventListener('error',()=>{if(audio.error){requestedPlayback=false;$('#audio-status').textContent='声音暂时加载失败，请再点一次发音。'}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSounds();cancelPrefetch()}else if(audio.readyState>=2)prefetchUpcoming()});
const wanted=new URLSearchParams(location.search).get('date');selectDate(data.days.some(d=>d.date===wanted)?wanted:data.days.some(d=>d.date===today)?today:data.days[0].date,false);

})();</script>

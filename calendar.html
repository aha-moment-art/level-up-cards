1,"last":650,"episodes":[{"title":"Should we pay more for chocolate?","source":"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026/ep-260312","audio":"calendar-audio/2026-09-30-1.mp3"},{"title":"Why are some animals black and white?","source":"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_2026/ep-260305","audio":"calendar-audio/2026-09-30-2.mp3"}],"reading":{"title":"A conference programme","url":"https://learnenglish.britishcouncil.org/free-resources/reading/b1/conference-programme"}}],"words":[{"id":1,"word":"cancel","meaning":"取消， 废除； 抵消， 对消； 删去， 划掉","ukphone":"'kænsl","usphone":"'kænsl","collocation":"cancel a booking","example":"We had to cancel our booking because the train stopped running.","translation":"火车停运了，我们只好取消预订。","note":""},{"id":2,"word":"explosive","meaning":"爆炸的， 爆发的； 使人冲动的；爆炸物，炸药","ukphone":"ɪk'spləusɪv","usphone":"ɪk'splosɪv; ɪk'splozɪv","collocation":"explosive growth","example":"The town experienced explosive growth after the new railway opened.","translation":"新铁路开通后，这个城镇迅速发展。","note":""},{"id":3,"word":"prepare","meaning":"准备， 预备","ukphone":"prɪ'peə(r)","usphone":"prɪ'pɛr","collocation":"prepare for an exam","example":"Maya stayed home to prepare for her final exam.","translation":"玛雅留在家里准备期末考试。","note":""},{"id":4,"word":"crusade","meaning":"加入十字军， 投身正义运动；十字军；斗争，运动","ukphone":"kruː'seɪd","usphone":"kru'sed","collocation":"a crusade against waste","example":"The students began a crusade against food waste on campus.","translation":"学生们在校园发起了反对食物浪费的运动。","note":""},{"id":5,"word":"hamlet","meaning":"小村庄","ukphone":"'hæmlət","usphone":"'hæmlət","collocation":"a remote hamlet","example":"A narrow footpath connects the remote hamlet to the main road.","translation":"一条狭窄的小路把这个偏远村庄与大路连接起来。","note":""},{"id":6,"word":"surgeon","meaning":"外科医生","ukphone":"'sɜːdʒən","usphone":"'sɝdʒən","collocation":"a skilled surgeon","example":"The surgeon explained the procedure carefully before answering our questions.","translation":"外科医生仔细解释了手术流程，然后回答我们的问题。","note":""},{"id":7,"word":"hall","meaning":"门厅； 礼堂","ukphone":"hɔːl","usphone":"hɔl","collocation":"the entrance hall","example":"Please leave your wet umbrella in the entrance hall.","translation":"请把湿雨伞放在门厅。","note":""},{"id":8,"word":"discourage","meaning":"使泄气， 使灰心； 阻止， 劝阻","ukphone":"dɪs'kʌrɪdʒ","usphone":"dɪs'kɝɪdʒ","collocation":"discourage someone from doing","example":"One disappointing result should not discourage you from trying again.","translation":"一次令人失望的结果不该让你放弃再次尝试。","note":""},{"id":9,"word":"predispose","meaning":"事先影响某人； 偏爱； 易受感染","ukphone":"ˌpriːdɪ'spəuz","usphone":"'pridɪ'spoz","collocation":"predispose someone to","example":"Early success may predispose students to expect equally easy progress later.","translation":"早期的成功可能使学生倾向于期待以后也能轻松进步。","note":"常用义为“使倾向于；使易受某事影响”，不是主动“偏爱”。"},{"id":10,"word":"oversee","meaning":"监督， 监视； 俯瞰， 眺望","ukphone":"ˌəuvə'siː","usphone":"'ovɚ'si","collocation":"oversee a project","example":"An experienced engineer will oversee the bridge repair project.","translation":"一位经验丰富的工程师将监督桥梁维修项目。","note":"现代常用义是“监督、管理”；不宜将“俯瞰、眺望”作为常用义。"},{"id":11,"word":"pollution","meaning":"污染， 污染物； 玷污","ukphone":"pə'luːʃn","usphone":"pə'luʃən","collocation":"air pollution","example":"The city introduced cleaner buses to reduce air pollution.","translation":"这座城市引进了更清洁的公交车，以减少空气污染。","note":""},{"id":12,"word":"pretend","meaning":"装作， 假装","ukphone":"prɪ'tend","usphone":"prɪ'tɛnd","collocation":"pretend to be asleep","example":"I tried to pretend to be asleep when the children entered.","translation":"孩子们进来时，我试图装睡。","note":""},{"id":13,"word":"convection","meaning":"传送； 对流","ukphone":"kən'vekʃn","usphone":"kən'vɛkʃən","collocation":"convection currents","example":"The teacher used coloured water to demonstrate convection currents.","translation":"老师用有色水演示对流。","note":"核心义是“对流”，不是一般的“传送”。"},{"id":14,"word":"warrant","meaning":"保证；","ukphone":"'wɒrənt","usphone":"'wɔrənt","collocation":"warrant further investigation","example":"These unexpected results warrant further investigation before we publish.","translation":"这些意外结果值得进一步调查后再发表。","note":"补充动词“使有必要；使正当”，名词“搜查令、逮捕令；依据”。"},{"id":15,"word":"ecliptic","meaning":"【天】","ukphone":"ɪ'klɪptɪk","usphone":"ɪ'klɪptɪk","collocation":"the ecliptic plane","example":"The diagram shows Earth's orbit within the ecliptic plane.","translation":"这张图展示了地球在黄道平面内的轨道。","note":"补全：黄道；黄道的。"},{"id":16,"word":"conceal","meaning":"隐藏； 隐瞒； 掩盖","ukphone":"kən'siːl","usphone":"kən'sil","collocation":"conceal the truth","example":"The damaged label could not conceal the bottle's age.","translation":"破损的标签无法掩盖这个瓶子的年代。","note":""},{"id":17,"word":"overrate","meaning":"对…评价过高， 高估","ukphone":"ˌəuvə'reɪt","usphone":",ovɚ'ret","collocation":"overrate one's ability","example":"Beginners sometimes overrate their ability and choose routes that are too difficult.","translation":"初学者有时高估自己的能力，选择过于困难的路线。","note":""},{"id":18,"word":"meanwhile","meaning":"与此同时","ukphone":"'miːnwaɪl","usphone":"'minwaɪl","collocation":"meanwhile at home","example":"I watered the garden; meanwhile, my brother prepared lunch.","translation":"我给花园浇水；与此同时，弟弟准备午餐。","note":""},{"id":19,"word":"opulent","meaning":"豪华的， 华丽的， 富裕的； 丰富的， 丰饶的","ukphone":"'ɒpjələnt","usphone":"'ɑpjələnt","collocation":"an opulent interior","example":"The hotel's opulent interior contrasted with its plain stone exterior.","translation":"酒店豪华的内部与朴素的石质外观形成对比。","note":""},{"id":20,"word":"coincide","meaning":"同时发生； 一致","ukphone":"ˌkəuɪn'saɪd","usphone":",koɪn'saɪd","collocation":"coincide with","example":"My visit will coincide with the opening of the exhibition.","translation":"我到访的时间将恰逢展览开幕。","note":""},{"id":21,"word":"competent","meaning":"有能力的； 能胜任的","ukphone":"'kɒmpɪtnt","usphone":"'kɑmpɪtənt","collocation":"a competent manager","example":"We need a competent manager who can organise the new team.","translation":"我们需要一位能组织新团队的称职经理。","note":""},{"id":22,"word":"require","meaning":"需要； 命令； 规定， 要求","ukphone":"rɪ'kwaɪə(r)","usphone":"rɪ'kwaɪr","collocation":"require approval","example":"Changes to the timetable require approval from the course director.","translation":"课表调整需要课程主任批准。","note":""},{"id":23,"word":"scratch","meaning":"划伤，","ukphone":"skrætʃ","usphone":"skrætʃ","collocation":"scratch the surface","example":"Be careful not to scratch the surface of the wooden table.","translation":"小心别划伤木桌的表面。","note":""},{"id":24,"word":"compassionate","meaning":"有同情心的， 表示怜悯的","ukphone":"kəm'pæʃənət","usphone":"kəm'pæʃənət","collocation":"compassionate care","example":"The volunteers offered compassionate support to families after the flood.","translation":"洪水过后，志愿者为各家提供了充满关怀的支持。","note":""},{"id":25,"word":"cooperative","meaning":"合作的，协作的；合作社","ukphone":"kəu'ɒpərətɪv","usphone":"ko'ɑpərətɪv","collocation":"a cooperative approach","example":"A cooperative approach helped both teams finish the project early.","translation":"合作的方式帮助两个团队提前完成了项目。","note":""},{"id":26,"word":"strategist","meaning":"战略家","ukphone":"'strætədʒɪst","usphone":"'strætədʒɪst","collocation":"a skilled strategist","example":"The team's strategist adjusted the plan after studying the opposition.","translation":"团队的策略师研究对手后调整了计划。","note":""},{"id":27,"word":"irritable","meaning":"急躁的， 易怒的， 易受刺激的； 过敏的","ukphone":"'ɪrɪtəbl","usphone":"'ɪrɪtəbl","collocation":"feel irritable","example":"After a sleepless night, I felt irritable during the morning meeting.","translation":"一夜未眠后，我在早会上感到烦躁。","note":""},{"id":28,"word":"triple","meaning":"三部分的；三倍的；增至三倍","ukphone":"'trɪpl","usphone":"'trɪpl","collocation":"triple the amount","example":"We need to triple the amount of rice for tonight's guests.","translation":"为了今晚的客人，我们需要把米量增加到三倍。","note":""},{"id":29,"word":"reserved","meaning":"说话不多的， 内向的； 有所保留的， 预订的","ukphone":"rɪ'zɜːvd","usphone":"rɪ'zɝvd","collocation":"a reserved manner","example":"Although usually reserved, she spoke confidently about her research.","translation":"她通常话不多，但谈起自己的研究却很自信。","note":""},{"id":30,"word":"temper","meaning":"情绪；使缓和","ukphone":"'tempə(r)","usphone":"'tɛmpɚ","collocation":"lose one's temper","example":"He lost his temper when the printer jammed again.","translation":"打印机再次卡纸时，他发火了。","note":""},{"id":31,"word":"tickle","meaning":"发痒；使高兴，逗乐；痒","ukphone":"'tɪkl","usphone":"'tɪkl","collocation":"tickle someone's feet","example":"The children laughed as tiny waves began to tickle their feet.","translation":"小浪花开始挠孩子们的脚，他们笑了起来。","note":""},{"id":32,"word":"object","meaning":"反对， 不赞成；物体；对象；目标；宾语[əb'dʒekt]","ukphone":"'ɒbdʒɪkt","usphone":"'ɑbdʒɛkt","collocation":"object to a proposal","example":"Several residents object to the proposal because it removes public gardens.","translation":"几位居民反对该提议，因为它会取消公共花园。","note":""},{"id":33,"word":"accessible","meaning":"能接近的； 易达到的","ukphone":"ək'sesəbl","usphone":"ək'sɛsəbl","collocation":"easily accessible","example":"The museum is easily accessible by bus from the station.","translation":"从车站乘公交可以方便地到达博物馆。","note":""},{"id":34,"word":"hang","meaning":"悬挂， 吊， 垂下； 吊死， 绞死","ukphone":"hæŋ","usphone":"hæŋ","collocation":"hang a picture","example":"We will hang the picture above the living room sofa.","translation":"我们会把这幅画挂在客厅沙发上方。","note":""},{"id":35,"word":"authenticate","meaning":"鉴别， 证明","ukphone":"ɔː'θentɪkeɪt","usphone":"ɔ'θɛntɪket","collocation":"authenticate a painting","example":"Experts examined the pigments to authenticate the recently discovered painting.","translation":"专家检查颜料，以鉴定这幅新近发现画作的真伪。","note":""},{"id":36,"word":"suffice","meaning":"满足， 满意； 足够","ukphone":"sə'faɪs","usphone":"sə'faɪs","collocation":"suffice for","example":"Two small tables should suffice for our exhibition materials.","translation":"两张小桌子应该足够放我们的展览材料。","note":"常用义是“足够；满足需要”，不表示感到“满意”。"},{"id":37,"word":"concede","meaning":"承认； 让步","ukphone":"kən'siːd","usphone":"kən'sid","collocation":"concede a point","example":"She had to concede that the cheaper design was more practical.","translation":"她不得不承认，更便宜的设计更实用。","note":""},{"id":38,"word":"notable","meaning":"值得注意的；显著的，杰出的，显赫的；名人， 要人","ukphone":"'nəutəbl","usphone":"'notəbl","collocation":"a notable improvement","example":"There has been a notable improvement in the river's water quality.","translation":"河流水质有了显著改善。","note":""},{"id":39,"word":"unparalleled","meaning":"无双的， 无比的， 空前的","ukphone":"ʌn'pærəleld","usphone":"ʌn'pærəlɛld","collocation":"unparalleled access","example":"The archive offers researchers unparalleled access to the writer's private letters.","translation":"该档案馆为研究者提供了无与伦比的作家私人信件查阅条件。","note":""},{"id":40,"word":"plush","meaning":"豪华的，舒适的；长毛绒","ukphone":"plʌʃ","usphone":"plʌʃ","collocation":"a plush sofa","example":"We sank into a plush sofa beside the hotel fireplace.","translation":"我们坐进酒店壁炉旁柔软舒适的沙发里。","note":""},{"id":41,"word":"evaporate","meaning":"蒸发； 消失； 不复存在","ukphone":"ɪ'væpəreɪt","usphone":"ɪ'væpəret","collocation":"evaporate quickly","example":"Water will evaporate more quickly from a shallow open dish.","translation":"水从敞口浅盘中蒸发得更快。","note":""},{"id":42,"word":"commission","meaning":"委托；佣金；授权， 委托","ukphone":"kə'mɪʃn","usphone":"kə'mɪʃən","collocation":"commission a portrait","example":"The library plans to commission a portrait of its founder.","translation":"图书馆计划委托画家为创始人绘制肖像。","note":""},{"id":43,"word":"staircase","meaning":"楼梯","ukphone":"'steəkeɪs","usphone":"'stɛrkes","collocation":"a spiral staircase","example":"A narrow staircase leads to the apartment above the bakery.","translation":"一段狭窄的楼梯通向面包店楼上的公寓。","note":""},{"id":44,"word":"flip","meaning":"轻抛； 轻弹","ukphone":"flɪp","usphone":"flɪp","collocation":"flip a coin","example":"We decided to flip a coin to choose the first player.","translation":"我们决定抛硬币来选出第一个玩家。","note":""},{"id":45,"word":"connect","meaning":"连接， 衔接； 联合， 关联； 由…联想到； 给…接通电话","ukphone":"kə'nekt","usphone":"kə'nɛkt","collocation":"connect to a network","example":"You can connect your laptop to the library's wireless network.","translation":"你可以把笔记本电脑连接到图书馆的无线网络。","note":""},{"id": uous statement","example":"The instructions were ambiguous, so we asked for an example.","translation":"说明含糊不清，所以我们要求给出一个例子。","note":""},{"id":441,"word":"crack","meaning":"破裂； 发出爆裂声； 重击； 崩溃， 瓦解；裂缝，缝隙；爆裂声","ukphone":"kræk","usphone":"kræk","collocation":"a narrow crack","example":"Sunlight entered through a narrow crack in the wooden shutters.","translation":"阳光透过木百叶窗上的一道窄缝照了进来。","note":""},{"id":442,"word":"bind","meaning":"捆绑， 系； 约束； 凝结","ukphone":"baɪnd","usphone":"baɪnd","collocation":"bind together","example":"Use string to bind the loose branches into a bundle.","translation":"用绳子把散落的树枝捆成一束。","note":""},{"id":443,"word":"cube","meaning":"立方形； 立方","ukphone":"kjuːb","usphone":"kjʊb","collocation":"an ice cube","example":"She dropped an ice cube into the warm lemonade.","translation":"她往温柠檬水中放入了一块冰块。","note":""},{"id":444,"word":"crisp","meaning":"脆的；利落的","ukphone":"krɪsp","usphone":"krɪsp","collocation":"a crisp apple","example":"I packed a crisp apple and some cheese for lunch.","translation":"我装了一个脆苹果和一些奶酪作午餐。","note":""},{"id":445,"word":"clot","meaning":"凝结成块；凝块","ukphone":"klɒt","usphone":"klɑt","collocation":"a blood clot","example":"The biology textbook includes a diagram of a blood clot.","translation":"生物教材里有一张血凝块示意图。","note":""},{"id":446,"word":"mild","meaning":"温柔的； 温和的； 轻微的","ukphone":"maɪld","usphone":"maɪld","collocation":"a mild winter","example":"The unusually mild winter allowed outdoor work to continue.","translation":"异常温和的冬季让户外工作得以继续。","note":""},{"id":447,"word":"impact","meaning":"影响， 作用； 冲击","ukphone":"'ɪmpækt","usphone":"ɪm'pækt","collocation":"environmental impact","example":"The study examines the environmental impact of the new road.","translation":"这项研究考察新道路对环境的影响。","note":""},{"id":448,"word":"profile","meaning":"面部的侧影，侧面轮廓；传略，人物简介；扼要介绍； 写传略","ukphone":"'prəufaɪl","usphone":"'profaɪl","collocation":"a personal profile","example":"The magazine published a profile of the young ceramic artist.","translation":"杂志刊登了这位年轻陶艺家的个人专访。","note" :"laundry","meaning":"洗衣房； 待洗衣服","ukphone":"'lɔːndri","usphone":"'lɔndri","collocation":"do the laundry","example":"I usually do the laundry while listening to the radio.","translation":"我通常一边听广播一边洗衣服。","note":""},{"id":602,"word":"grudge","meaning":"不满，积怨，","ukphone":"grʌdʒ","usphone":"ɡrʌdʒ","collocation":"hold a grudge","example":"She refused to hold a grudge over a minor disagreement.","translation":"她不愿为一次小分歧怀恨在心。","note":""},{"id":603,"word":"accumulate","meaning":"积累； 堆积","ukphone":"ə'kjuːmjəleɪt","usphone":"ə'kjumjəlet","collocation":"accumulate evidence","example":"Researchers began to accumulate evidence from several independent studies.","translation":"研究人员开始从几项独立研究中积累证据。","note":""},{"id":604,"word":"crime","meaning":"罪行； 犯罪","ukphone":"kraɪm","usphone":"kraɪm","collocation":"a crime novel","example":"The library hosts a monthly discussion group for crime novels.","translation":"图书馆每月举办一次犯罪小说读书会。","note":""},{"id":605,"word":"surround","meaning":"围绕； 包围","ukphone":"sə'raund","usphone":"sə'raʊnd","collocation":"surround a village","example":"Low stone walls surround the village's oldest vegetable gardens.","translation":"低矮的石墙围绕着村里最古老的菜园。","note":""},{"id":606,"word":"leisure","meaning":"空闲时间； 悠闲","ukphone":"'leʒə(r)","usphone":"'liʒɚ","collocation":"leisure time","example":"He spends most of his leisure time restoring old bicycles.","translation":"他把大部分闲暇时间用来修复旧自行车。","note":""},{"id":607,"word":"pavement","meaning":"人行道； 地面， 路面","ukphone":"'peɪvmənt","usphone":"'pevmənt","collocation":"a narrow pavement","example":"The narrow pavement becomes crowded when the school day ends.","translation":"放学时，狭窄的人行道变得拥挤。","note":""},{"id":608,"word":"undetected","meaning":"未被发现的","ukphone":"ˌʌndɪ'tektɪd","usphone":"'ʌndɪ'tɛktɪd","collocation":"go undetected","example":"The spelling error went undetected until the book was printed.","translation":"这个拼写错误直到书印出来才被发现。","note":""},{"id":609,"word":"irregularity","meaning":"不规则， 无规律","ukphone":"ɪˌregjə'lærəti","usphone":"ɪ' ote":""},{"id":617,"word":"comparable","meaning":"可比较的， 类似的； 比得上的","ukphone":"'kɒmpərəbl","usphone":"'kɑmpərəbl","collocation":"comparable results","example":"The two surveys produced comparable results despite their different methods.","translation":"尽管方法不同，两次调查得出了相近的结果。","note":""},{"id":618,"word":"self-esteem","meaning":"自尊； 自负","ukphone":"ˌselfɪ'stiːm","usphone":"ˌsɛlfəˈstim","collocation":"build self-esteem","example":"Completing the difficult project helped build her self-esteem.","translation":"完成这个困难的项目帮助她增强了自尊与自信。","note":""},{"id":619,"word":"dimensional","meaning":"…度空间的， …维的","ukphone":"daɪ'menʃnl","usphone":"dɪ'menʃənəl","collocation":"dimensional accuracy","example":"The engineer checked the dimensional accuracy of each wooden component.","translation":"工程师检查了每个木制部件的尺寸精度。","note":"此例中的 dimensional 指“尺寸的”；除空间维度外，也可修饰尺寸及其精度。"},{"id":620,"word":"presumably","meaning":"推测起来， 大概","ukphone":"prɪ'zjuːməbli","usphone":"prɪ'zuməbli","collocation":"presumably because","example":"The café was closed, presumably because the owners were away.","translation":"咖啡馆关门了，大概是因为店主外出了。","note":""},{"id":621,"word":"subject","meaning":"受…支配的， 取决于…的； 易遭受…的；题目；学科；主语['sʌbdʒ3kt]","ukphone":"'sʌbdʒɪkt","usphone":"ˈsʌbdʒɪkt;(for adj.)ˈsʌbdʒɪkt;(for v.)səbˈdʒɛkt","collocation":"a favourite subject","example":"History became my favourite subject after our visit to the museum.","translation":"参观博物馆后，历史成了我最喜欢的科目。","note":""},{"id":622,"word":"bonus","meaning":"奖金， 红利； 好处","ukphone":"'bəunəs","usphone":"'bonəs","collocation":"an added bonus","example":"The flat's small balcony was an unexpected bonus.","translation":"公寓的小阳台是一个意料之外的额外好处。","note":""},{"id":623,"word":"recognition","meaning":"识别； 认出； 承认， 确认， 认可； 赏识， 表彰","ukphone":"ˌrekəg'nɪʃn","usphone":",rɛkəɡ'nɪʃən","collocation":"gain recognition","example":"Her early photographs gained recognition at a local arts festival.","translation":"她早期的摄影作品在一个当地艺术节上获得了认可。","note":""},{"id":624,"word":"aisle","meaning":"走廊， 通道； 侧廊","ukphone":"aɪl","usphone":"aɪl","collocation":"an aisle seat","example":"I prefer an aisle seat on long train journeys.","translation":"长途坐火车时，我更喜欢靠过道的座位。","note":""},{"id":625,"word":"arrangement","meaning":"安排；","ukphone":"ə'reɪndʒmənt","usphone":"ə'rendʒmənt","collocation":"travel arrangements","example":"Please confirm the travel arrangements before booking your accommodation.","translation":"预订住宿前，请确认出行安排。","note":""},{"id":626,"word":"revenue","meaning":"收入； 税收","ukphone":"'revənjuː","usphone":"'rɛvənu","collocation":"ticket revenue","example":"Ticket revenue helped cover the cost of restoring the theatre.","translation":"门票收入帮助支付了修复剧院的费用。","note":""},{"id":627,"word":"strip","meaning":"剥夺；夺去，使空无一物；拆卸，拆开；带状物； 条纹； 狭长地带， 带状水域","ukphone":"strɪp","usphone":"strɪp","collocation":"a strip of land","example":"A narrow strip of grass separates the path from the road.","translation":"一条窄草带把小路与公路隔开。","note":""},{"id":628,"word":"monopoly","meaning":"垄断， 专卖； 垄断商品， 专卖商品","ukphone":"mə'nɒpəli","usphone":"mə'nɑpəli","collocation":"a virtual monopoly","example":"For years, one company held a monopoly on local deliveries.","translation":"多年来，一家公司垄断了当地配送业务。","note":""},{"id":629,"word":"continuous","meaning":"连续的， 不断的","ukphone":"kən'tɪnjuəs","usphone":"kən'tɪnjʊəs","collocation":"continuous improvement","example":"The workshop encourages continuous improvement through regular feedback.","translation":"工作坊通过定期反馈，鼓励持续改进。","note":""},{"id":630,"word":"bilingual","meaning":"两种语言的","ukphone":"ˌbaɪ'lɪŋgwəl","usphone":"'baɪ'lɪŋgwəl","collocation":"a bilingual dictionary","example":"A bilingual dictionary helped me understand the unfamiliar recipe.","translation":"一本双语词典帮助我看懂了陌生的食谱。","note":""},{"id":631,"word":"residence","meaning":"住宅， 住处； 居住","ukphone":"'rezɪdəns","usphone":"'rɛzɪdəns","collocation":"a private residence","example":"The former school building is now a private residence.","translation":"原来的学校建筑现在是一处私人住宅。","note":""},{"id":632,"word":"oxygen","meaning":"氧， 氧气","ukphone":"'ɒksɪdʒən","usphone":"'ɑksɪdʒən","collocation":"release oxygen","example":"The experiment measured how much oxygen the plants released.","translation":"实验测量了这些植物释放的氧气量。","note":""},{"id":633,"word":"intensive","meaning":"加强的； 密集的","ukphone":"ɪn'tensɪv","usphone":"ɪn'tɛnsɪv","collocation":"an intensive course","example":"She joined an intensive course before taking the language exam.","translation":"参加语言考试前，她上了一门强化课程。","note":""},{"id":634,"word":"alter","meaning":"改变； 变动","ukphone":"'ɔːltə(r)","usphone":"'ɔltɚ","collocation":"alter a plan","example":"We had to alter our route because the bridge was closed.","translation":"因为桥关闭了，我们不得不调整路线。","note":""},{"id":635,"word":"combine","meaning":"联合， 结合","ukphone":"kəm'baɪn","usphone":"kəm'baɪn","collocation":"combine with","example":"The recipe asks you to combine flour with warm water.","translation":"食谱要求把面粉与温水混合。","note":""},{"id":636,"word":"ideal","meaning":"理想的，完美的；理想主义的；空想的；唯心的；理想； 理想的东西","ukphone":"aɪ'diːəl","usphone":"aɪ'diəl","collocation":"an ideal location","example":"The quiet courtyard is an ideal location for outdoor reading.","translation":"安静的庭院是户外阅读的理想地点。","note":""},{"id":637,"word":"comedy","meaning":"喜剧； 喜剧性","ukphone":"'kɒmədi","usphone":"'kɑmədi","collocation":"a romantic comedy","example":"We watched a light comedy after a demanding day.","translation":"忙碌了一天后，我们看了一部轻松的喜剧。","note":""},{"id":638,"word":"broom","meaning":"扫帚","ukphone":"bruːm","usphone":"brum","collocation":"a wooden broom","example":"He used a broom to clear leaves from the doorway.","translation":"他用扫帚清理了门口的落叶。","note":""},{"id":639,"word":"equipment","meaning":"设备， 装备","ukphone":"ɪ'kwɪpmənt","usphone":"ɪ'kwɪpmənt","collocation":"specialist equipment","example":"The workshop provides all the equipment needed for basic repairs.","translation":"这间工作坊提供基础修理所需的全部设备。","note":""},{"id":640,"word":"pressure","meaning":"压力，压强；强制，压迫；对…施加压力； 迫使， 说服","ukphone":"'preʃə(r)","usphone":"'prɛʃɚ","collocation":"under pressure","example":"The team worked we function restoreSession(ids, saved) {
  const fresh = { signature: ids.join(','), mode: 'learn', queue: [...ids], cursor: 0, ratings: {} };
  if (!saved || saved.signature !== fresh.signature) return fresh;
  const validQueue = Array.isArray(saved.queue) && saved.queue.length > 0 &&
    new Set(saved.queue).size === saved.queue.length && saved.queue.every(id => ids.includes(id));
  const validMode = validQueue && (saved.mode === 'review' || (saved.mode === 'learn' && saved.queue.join(',') === fresh.signature));
  if (!validQueue || !validMode || !Number.isInteger(saved.cursor) || saved.cursor < 0 || saved.cursor > saved.queue.length) return fresh;
  const ratings = {};
  for (const id of ids) if (['known', 'unknown'].includes(saved.ratings?.[id])) ratings[id] = saved.ratings[id];
  return { ...fresh, mode: saved.mode, queue: [...saved.queue], cursor: saved.cursor, ratings };
}

function rateWord(session, rating) {
  if (!['known', 'unknown'].includes(rating) || session.cursor >= session.queue.length) return session;
  const id = session.queue[session.cursor];
  return { ...session, cursor: session.cursor + 1, ratings: { ...session.ratings, [id]: rating } };
}

function reviewWords(session, ids) {
  const queue = ids.filter(id => session.ratings[id] === 'unknown');
  return queue.length ? { ...session, mode: 'review', queue, cursor: 0 } : session;
}

function moveCard(session, direction) {
  if (direction !== -1 && direction !== 1) return session;
  const cursor = Math.max(0, Math.min(session.queue.length - 1, session.cursor + direction));
  return cursor === session.cursor ? session : { ...session, cursor };
}

function rememberWord(session, rating) {
  if (!['known', 'unknown'].includes(rating) || session.cursor >= session.queue.length) return session;
  return { ...session, ratings: { ...session.ratings, [session.queue[session.cursor]]: rating } };
}

// The requested direction is left = previous, right = next.
function swipeDirection(dx, dy) {
  return Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.35 ? Math.sign(dx) : 0;
}

$('#word').addEventListener('click',playWord);$('#speaker').addEventListener('click',playWord);
$('#flip').addEventListener('click',()=>flip(!flipped));$('#previous').addEventListener('click',()=>navigate(-1));$('#next').addEventListener('click',()=>navigate(1));
document.querySelectorAll('[data-accent]').forEach(b=>b.addEventListener('click',()=>{accent=b.dataset.accent;write('ielts-daily-accent-v1',accent);prepareAudio()}));
document.querySelectorAll('[data-rating]').forEach(b=>b.addEventListener('click',()=>{const wasFlipped=flipped;session=rememberWord(session,b.dataset.rating);const saved=read('ielts-word-progress-v1',[]);const mastered=new Set(Array.isArray(saved)?saved:[]);b.dataset.rating==='known'?mastered.add(current().id):mastered.delete(current().id);write('ielts-word-progress-v1',[...mastered]);renderWord();flip(wasFlipped)}));
$('#review').addEventListener('click',()=>{session=reviewWords(session,ids);renderWord()});$('#all-words').addEventListener('click',()=>{session={...session,mode:'learn',queue:[...ids],cursor:0};renderWord()});
const card=$('#word-card');card.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation();return}if(!e.target.closest('button,summary,details,a'))flip(!flipped)},true);
card.addEventListener('keydown',e=>{if(e.target.closest('button,summary,details,a'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();navigate(e.key==='ArrowLeft'?-1:1)}else if(e.target===card&&(e.key===' '||e.key==='Enter')){e.preventDefault();flip(!flipped)}});
card.addEventListener('pointerdown',e=>{if(!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,horizontal:false};suppressUntil=0});
card.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.horizontal&&Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){gesture=null;return}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.35){gesture.horizontal=true;if(!card.hasPointerCapture(e.pointerId))card.setPointerCapture(e.pointerId);e.preventDefault()}});
card.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);if(!g.horizontal)return;suppressUntil=performance.now()+400;e.preventDefault();const dir=swipeDirection(e.clientX-g.x,e.clientY-g.y);if(dir)navigate(dir)});
card.addEventListener('pointercancel',()=>gesture=null);card.addEventListener('lostpointercapture',e=>{if(e.target===card&&gesture?.id===e.pointerId)gesture=null});
audio.addEventListener('canplay',prefetchUpcoming);
audio.addEventListener('waiting',()=>{if(requestedPlayback)$('#audio-status').textContent='正在加载发音…'});
audio.addEventListener('playing',()=>{if(requestedPlayback&&!audio.paused)$('#audio-status').textContent=`正在播放${accent==='uk'?'英音':'美音'}`});
audio.addEventListener('ended',()=>{if(audio.ended){requestedPlayback=false;$('#audio-status').textContent='播放完毕 · 可再次点读'}});
audio.addEventListener('error',()=>{if(audio.error){requestedPlayback=false;$('#audio-status').textContent='声音暂时加载失败，请再点一次发音。'}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSounds();cancelPrefetch()}else if(audio.readyState>=2)prefetchUpcoming()});
const wanted=new URLSearchParams(location.search).get('date');selectDate(data.days.some(d=>d.date===wanted)?wanted:data.days.some(d=>d.date===today)?today:data.days[0].date,false);

})();</script>
</body></html>
